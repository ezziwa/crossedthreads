  async updateStorageInfo() {
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const est = await navigator.storage.estimate();
        const used = ((est.usage || 0) / 1024 / 1024).toFixed(2);
        const quota = ((est.quota || 0) / 1024 / 1024).toFixed(0);
        const el = document.getElementById('storage-usage');
        if (el) el.textContent = `${used} MB used of ~${quota} MB`;
      }
      if (navigator.storage && navigator.storage.persisted) {
        const persisted = await navigator.storage.persisted();
        const el = document.getElementById('persist-status');
        if (el) el.textContent = persisted ? 'Granted (protected)' : 'Not granted';
      }
    } catch (e) { /* ignore */ }
  },

  dataCounts() {
    const d = Store.data || {};
    return {
      invoices: (d.invoices || []).length,
      quotes: (d.quotes || []).length,
      customers: (d.customers || []).length,
      products: (d.products || []).length,
      expenses: (d.expenses || []).length
    };
  },

  clearData(kind) {
    const n = this.dataCounts();
    const configs = {
      documents: {
        total: n.invoices + n.quotes,
        title: 'Delete Invoices & Quotes',
        message: `Permanently delete ${n.invoices} invoice(s) and ${n.quotes} quote(s)? Numbering restarts at 1. Customers, catalogue items and expenses are kept. This cannot be undone.`,
        confirmLabel: 'Delete Documents',
        apply: () => {
          Store.data.invoices = [];
          Store.data.quotes = [];
          Store.data.business.nextInvoiceNo = 1;
          Store.data.business.nextQuoteNo = 1;
        },
        done: 'Invoices and quotes deleted'
      },
      customers: {
        total: n.customers,
        title: 'Delete Customers',
        message: `Permanently delete all ${n.customers} customer(s)? Existing invoices keep their name and contact details, but will no longer be linked to a customer.`,
        confirmLabel: 'Delete Customers',
        apply: () => {
          Store.data.customers = [];
          [...Store.data.invoices, ...Store.data.quotes].forEach(d => { d.customerId = ''; });
        },
        done: 'Customers deleted'
      },
      products: {
        total: n.products,
        title: 'Delete Catalogue',
        message: `Permanently delete all ${n.products} catalogue item(s)? Existing invoices are not affected.`,
        confirmLabel: 'Delete Catalogue',
        apply: () => { Store.data.products = []; },
        done: 'Catalogue cleared'
      },
      expenses: {
        total: n.expenses,
        title: 'Delete Expenses',
        message: `Permanently delete all ${n.expenses} expense record(s)? This cannot be undone.`,
        confirmLabel: 'Delete Expenses',
        apply: () => { Store.data.expenses = []; },
        done: 'Expenses deleted'
      }
    };
    const cfg = configs[kind];
    if (!cfg) return;
    if (!cfg.total) { toast('Nothing to delete'); return; }
    confirmDialog(cfg.title, cfg.message, async () => {
      cfg.apply();
      await Store.persist();
      toast(cfg.done);
      this.render();
    }, { confirmLabel: cfg.confirmLabel });
  },

  eraseAllData() {
    const n = this.dataCounts();
    confirmDialog(
      'Delete All App Data',
      `This permanently deletes ${n.invoices} invoice(s), ${n.quotes} quote(s), ${n.customers} customer(s), ${n.products} catalogue item(s) and ${n.expenses} expense(s), plus business details, logo, stamp settings and your PIN. The app returns to a fresh install with the default PIN ${DEFAULT_PIN}. Download a backup first if you need this data.`,
      async () => {
        Store.data = Store.defaultData();
        // Never re-seed demo data after an explicit erase.
        Store.data.invoices = [];
        Store.data.quotes = [];
        Store.data.customers = [];
        Store.data.products = [];
        Store.data.expenses = [];
        await Store.persist();
        // Remove any localStorage mirror/legacy snapshot so erased data cannot resurface.
        try {
          localStorage.removeItem(Store.KEY);
          localStorage.removeItem('ct_install_dismissed');
        } catch (_) { /* ignore */ }
        try { sessionStorage.setItem('crossed_threads_unlocked', 'true'); } catch (_) { /* ignore */ }
        this.state.view = 'home';
        this.state.params = {};
        this.state.invoiceTab = 'invoices';
        this.state.filter = 'all';
        this.state.search = '';
        this.state.pinInput = '';
        this.applyTheme();
        toast('All app data deleted');
        this.navigate('home');
      },
      { confirmLabel: 'Delete Everything', requireText: 'DELETE' }
    );
  },

  async fetchReleaseInfo() {
    const response = await fetch(`./version.json?check=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`version.json HTTP ${response.status}`);
    const info = await response.json();
    if (!info || !info.version) throw new Error('Invalid version.json');
    return info;
  },

  async checkForUpdatesSilently() {
    try {
      const info = await this.fetchReleaseInfo();
      this.state.updateInfo = { ...info, checkedAt: Date.now() };
      if (!this.isLocked() && compareVersions(info.version, APP_VERSION) > 0 && (this.state.view === 'home' || this.state.view === 'settings')) {
        this.render();
      }
    } catch (e) {
      console.warn('Update check skipped:', e.message || e);
    }
  },

  async checkForUpdates() {
    toast('Checking for updates…');
    let info = null;
    try {
      info = await this.fetchReleaseInfo();
    } catch (e) {
      console.warn('Update check failed:', e);
    }
    if (!info) {
      toast('Could not check online — reloading app');
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) await reg.update();
      } catch (_) { /* ignore */ }
      setTimeout(() => location.reload(), 700);
      return;
    }
    this.state.updateInfo = { ...info, checkedAt: Date.now() };
    if (compareVersions(info.version, APP_VERSION) > 0) {
      this.showUpdateDialog(this.state.updateInfo);
      return;
    }
    toast(`You're on the latest version (v${APP_VERSION})`);
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
    } catch (_) { /* ignore */ }
    if (this.state.view === 'settings') this.render();
  },

  showUpdateDialog(info) {
    if (!info) return;
    const notes = (info.notes || []).slice(0, 8).map(note => '• ' + note).join('\n');
    const message = `You are currently on v${APP_VERSION}. Version ${info.version}${info.released ? ` was released on ${info.released}` : ''}.\n\n${notes || 'A new version is ready.'}\n\nYour invoices, customers and settings are not affected.`;
    confirmDialog(
      `Update available — v${info.version}`,
      message,
      async () => {
        this._manualUpdate = true;
        try {
          const reg = await navigator.serviceWorker.getRegistration();
          if (reg) {
            await reg.update();
            const worker = reg.installing || reg.waiting;
            if (worker && worker.state !== 'activated' && worker.state !== 'redundant') {
              await new Promise((resolve) => {
                const timer = setTimeout(resolve, 6000);
                worker.addEventListener('statechange', () => {
                  if (['installed', 'activated', 'redundant'].includes(worker.state)) {
                    clearTimeout(timer);
                    resolve();
                  }
                });
              });
            }
            if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
          }
        } catch (e) {
          console.warn('Could not refresh service worker:', e);
        }
        location.reload();
      },
      { confirmLabel: 'Reload & Update', danger: false, cancelLabel: 'Later' }
    );
  },

  async openWhatsNew() {
    let info = this.state.updateInfo;
    if (!info) {
      try {
        info = await this.fetchReleaseInfo();
        this.state.updateInfo = { ...info, checkedAt: Date.now() };
      } catch (e) {
        console.warn('Release notes unavailable:', e);
      }
    }
    if (!info) {
      toast('Release notes are unavailable offline');
      return;
    }
    const notes = (info.notes || []).map(note => '• ' + note).join('\n');
    showModal(`
      <h3 class="modal-title">What's New — v${escapeHTML(info.version)}</h3>
      <p style="color:var(--text-secondary); font-size:12px; margin:0 0 12px;">${info.released ? 'Released ' + escapeHTML(info.released) : ''}</p>
      <div class="release-notes">${escapeHTML(notes || 'No release notes for this version.')}</div>
      <button class="btn btn-primary btn-block" onclick="closeModal()">Close</button>
    `);
  },

  async downloadBackup() {
    try {
      Store.data.lastBackupAt = Date.now();
      const json = await Store.exportBackup();
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `crossed-threads-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      await Store.persist();
      const lastEl = document.getElementById('last-backup-value');
      if (lastEl) lastEl.textContent = `${formatDate(todayStr())} (today)`;
      toast('Backup downloaded');
      if (this.state.view === 'home') this.render();
    } catch (e) {
      toast('Backup failed');
      console.error(e);
    }
  },

  handleRestoreFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const text = ev.target.result;
        // Validate
        const parsed = JSON.parse(text);
        if (!parsed.data || !parsed.data.business) throw new Error('Invalid format');
        confirmDialog('Restore Backup', 'This will OVERWRITE all current invoices, customers, products and settings on this device. Continue?', async () => {
          await Store.importBackup(text);
          toast('Backup restored successfully');
          this.render();
        }, { confirmLabel: 'Restore Backup', danger: false });
      } catch (e) {
        toast('Invalid backup file');
        console.error(e);
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  },

  saveBusinessSetting(key, value) {
    Store.data.business[key] = value;
    Store.save();
    toast('Saved');
    if (['name','address','phone','email','currency'].includes(key)) this.render();
  },

  saveStampSetting(key, value) {

    Store.save();
    const previewBox = document.getElementById('stamp-preview-box');

    toast('Stamp updated');
    if (['dateMode'].includes(key)) this.render();

  saveSecuritySetting(key, value) {

    Store.data.security[key] = value;
    Store.save();
    toast('Security updated');
    this.render();
  },

  openChangePinModal() {
    showModal(`
      <h3 class="modal-title">Change PIN</h3>
      <p style="color:var(--text-secondary); margin:0 0 16px; font-size:12.5px; line-height:1.5;">
        Use 4–6 digits. A 6-digit PIN is much harder to guess than 4 digits. Avoid the factory default ${DEFAULT_PIN}, 1234, birth years and your phone number.
      </p>
      <div class="form-group">
        <label class="form-label">Current PIN</label>
        <input type="password" class="form-input" id="pin-current" placeholder="Enter current PIN" maxlength="6" inputmode="numeric" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">New PIN (4–6 digits)</label>
        <input type="password" class="form-input" id="pin-new" placeholder="e.g. 10519" maxlength="6" inputmode="numeric" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New PIN</label>
        <input type="password" class="form-input" id="pin-confirm" placeholder="Confirm new PIN" maxlength="6" inputmode="numeric" autocomplete="off">
      </div>
      <div style="display:flex; gap:8px; margin-top:8px">
        <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" style="flex:1" onclick="App.changePin()">Save PIN</button>
      </div>
    `);
  },

  async changePin() {
    const cur = document.getElementById('pin-current').value;
    const nw = document.getElementById('pin-new').value;
    const cf = document.getElementById('pin-confirm').value;
    const sec = Store.data.security || { pin: DEFAULT_PIN };
    if (cur !== (sec.pin || DEFAULT_PIN)) { toast('Current PIN is incorrect'); return; }
    if (!/^\d{4,6}$/.test(nw)) { toast('New PIN must be 4–6 digits'); return; }
    if (nw !== cf) { toast('PINs do not match'); return; }
    Store.data.security.pin = nw;
    await Store.persist();
    closeModal();
    toast(`PIN changed to ${nw.length} digits`);
    this.render();
    if (!Store.data.security.recoveryHash) {
      await this.createRecoveryCode();
    }
  },

  openRecoveryCodeSettings() {
    const sec = Store.data.security || {};
    if (sec.recoveryHash) {
      confirmDialog(
        'Replace Recovery Code',
        'Create a new recovery code? The existing code will stop working immediately.',
        () => this.createRecoveryCode(),
        { confirmLabel: 'Create New Code', danger: false }
      );
    } else {
      this.createRecoveryCode();
    }
  },

  async createRecoveryCode() {
    try {
      if (!window.crypto || !window.crypto.subtle) {
        toast('Recovery codes require the https app (GitHub Pages)');
        return;
      }
      const code = generateRecoveryCode();
      const hash = await hashRecoveryCode(code);
      if (!Store.data.security) Store.data.security = { pin: DEFAULT_PIN, enabled: true };
      Store.data.security.recoveryHash = hash;
      Store.data.security.recoveryCreatedAt = Date.now();
      await Store.persist();
      this.render();
      this.showRecoveryCode(code);
    } catch (e) {
      console.error('Recovery code creation failed', e);
      toast('Could not create a recovery code');
    }
  },

  showRecoveryCode(code) {
    const formatted = formatRecoveryCode(code);
    this._lastRecoveryCode = code;
    showModal(`
      <h3 class="modal-title">Save your recovery code</h3>
      <p style="color:var(--text-secondary); margin:0 0 14px; font-size:13px; line-height:1.5;">
        If you forget your PIN, tap <strong>Forgot PIN?</strong> on the lock screen and enter this code. It is shown only once.
      </p>
      <div class="recovery-code-box">${formatted}</div>
      <p style="color:var(--text-tertiary); margin:0 0 14px; font-size:11px; line-height:1.5;">
        Keep it private — anyone with this code can reset your PIN. Store it with your JSON backup.
      </p>
      <div class="share-actions">
        <button class="btn btn-secondary" onclick="App.copyRecoveryCode()">Copy</button>
        <button class="btn btn-secondary" onclick="App.downloadRecoveryCode()">Download</button>
      </div>
      <button class="btn btn-primary btn-block" onclick="App.closeRecoveryCodeModal()">I've saved it</button>
    `);
    // Force an explicit acknowledgement so the one-time code isn't lost by a stray tap.
    const overlay = document.querySelector('.modal-overlay');
    if (overlay) overlay.onclick = null;
  },

  copyRecoveryCode() {
    if (!this._lastRecoveryCode) return;
    const text = formatRecoveryCode(this._lastRecoveryCode);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => toast('Recovery code copied'))
        .catch(() => this.fallbackCopyText(text));
    } else {
      this.fallbackCopyText(text);
    }
  },

  fallbackCopyText(text) {
    try {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
      toast('Recovery code copied');
    } catch (e) {
      toast('Could not copy — select the code manually');
    }
  },

  downloadRecoveryCode() {
    if (!this._lastRecoveryCode) return;
    const code = formatRecoveryCode(this._lastRecoveryCode);
    const text = [
      'Crossed Threads — PIN recovery code',
      '',
      code,
      '',
      `Created: ${formatDate(todayStr())}`,
      '',
      'Use this code on the lock screen: Forgot PIN? → enter this code → set a new PIN.',
      'Keep it private. Anyone with this code can reset your PIN.',
      'A new code is generated each time you replace it or recover your PIN.'
    ].join('\n');
    this.saveBlob(new Blob([text], { type: 'text/plain' }), 'crossed-threads-recovery-code.txt');
    toast('Recovery code downloaded');
  },

  closeRecoveryCodeModal() {
    this._lastRecoveryCode = null;
    closeModal();
  },

  openRecoveryModal() {
    const sec = Store.data.security || {};
    if (!sec.recoveryHash) {
      showModal(`
        <h3 class="modal-title">Forgot PIN?</h3>
        <p style="color:var(--text-secondary); margin:0 0 14px; font-size:13px; line-height:1.5;">
          No recovery code has been created on this phone yet, so the PIN cannot be recovered inside the app.
        </p>
        <p style="color:var(--text-secondary); margin:0 0 16px; font-size:13px; line-height:1.5;">
          Unlock with your PIN, then create one in <strong>Settings → Security &amp; App Lock</strong>. If you cannot unlock, restore a JSON backup or reset the app (this erases local data).
        </p>
        <button class="btn btn-secondary btn-block" onclick="closeModal()">Close</button>
      `);
      return;
    }
    showModal(`
      <h3 class="modal-title">Recover with code</h3>
      <p style="color:var(--text-secondary); margin:0 0 14px; font-size:13px; line-height:1.5;">
        Enter the recovery code you saved, then choose a new 4–6 digit PIN. The recovery code is not your PIN.
      </p>
      <div class="form-group">
        <label class="form-label">Recovery code</label>
        <input type="text" class="form-input" id="recovery-code" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="24" autocapitalize="characters" autocomplete="off" spellcheck="false">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">New PIN</label>
          <input type="password" class="form-input" id="recovery-new-pin" placeholder="4–6 digits" maxlength="6" inputmode="numeric" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm PIN</label>
          <input type="password" class="form-input" id="recovery-confirm-pin" placeholder="Repeat PIN" maxlength="6" inputmode="numeric" autocomplete="off">
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" style="flex:1" onclick="App.resetPinWithRecovery()">Reset PIN</button>
      </div>
    `);
    setTimeout(() => document.getElementById('recovery-code')?.focus(), 80);
  },

  async resetPinWithRecovery() {
    const code = document.getElementById('recovery-code').value;
    const newPin = document.getElementById('recovery-new-pin').value;
    const confirmPin = document.getElementById('recovery-confirm-pin').value;
    const sec = Store.data.security || {};
    if (!sec.recoveryHash) { toast('No recovery code is set'); return; }
    if (!/^\d{4,6}$/.test(newPin)) { toast('New PIN must be 4–6 digits'); return; }
    if (newPin !== confirmPin) { toast('PINs do not match'); return; }
    let hash;
    try {
      hash = await hashRecoveryCode(code);
    } catch (e) {
      console.error(e);
      toast('Recovery codes require the https app');
      return;
    }
    if (hash !== sec.recoveryHash) { toast('Incorrect recovery code'); return; }
    try {
      const newCode = generateRecoveryCode();
      sec.pin = newPin;
      sec.recoveryHash = await hashRecoveryCode(newCode);
      sec.recoveryCreatedAt = Date.now();
      await Store.persist();
      sessionStorage.setItem('crossed_threads_unlocked', 'true');
      this.state.pinInput = '';
      this.state.view = 'home';
      this.state.params = {};
      this.render();
      this.showRecoveryCode(newCode);
      toast('PIN reset. Save your new recovery code.');
    } catch (e) {
      console.error('PIN recovery failed', e);
      toast('Could not reset the PIN');
    }
  },

    const activeCount = all.filter(p => !p.archived).length;
    const archivedCount = all.filter(p => p.archived).length;
    const tab = this.state.productTab === 'archived' ? 'archived' : 'active';

        (p.name || '').toLowerCase().includes(search) ||
        (p.category || '').toLowerCase().includes(search) ||
        (p.description || '').toLowerCase().includes(search)
      );
    }
    list = [...list].sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    return `<div class="page">
      <div class="page-header">
        <div class="topbar">
          <button class="back-btn" onclick="App.navigate('settings')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>

          <h1 style="font-size:17px; font-weight:700; margin:0">Products & Services</h1>
          <div style="width:60px"></div>
        </div>
      </div>
      <div class="page-body">
        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Search catalogue..." value="${escapeHTML(this.state.search||'')}" oninput="App.state.search=this.value;App.render()">
        </div>
        <div class="tabs">
          <button class="tab ${tab === 'active' ? 'active' : ''}" onclick="App.state.productTab='active';App.state.search='';App.render()">Active (${activeCount})</button>
          <button class="tab ${tab === 'archived' ? 'active' : ''}" onclick="App.state.productTab='archived';App.state.search='';App.render()">Archived (${archivedCount})</button>
        </div>
        ${tab === 'active' ? `
          <button class="btn btn-primary btn-block mb-16" onclick="App.addProduct()">+ Add Product / Service</button>
          <p style="font-size:12px; color:var(--text-secondary); margin:0 0 12px;">Type a description on any invoice to get suggestions from this catalogue.</p>
        ` : `
          <p style="font-size:12px; color:var(--text-secondary); margin:0 0 16px;">Archived items are hidden from invoice suggestions. Restore them or delete them permanently.</p>
        `}
        ${list.length === 0
          ? (tab === 'active'
              ? this.emptyState('No products yet','Add products and services for quick invoicing','Add Product','App.addProduct()')
              : this.emptyState('No archived items','Items you remove from the catalogue will appear here', null, null))
          : list.map(p => `
            <div class="card">
              <div class="product-item">
                <div style="flex:1; min-width:0">
                  <div style="font-weight:600; font-size:14px">${escapeHTML(p.name)}</div>

                  ${p.description ? `<div style="font-size:11px; color:var(--text-secondary); margin-top:2px">${escapeHTML(p.description)}</div>` : ''}
                  <div class="product-price">${formatCurrency(p.price)}</div>
                </div>
                <div style="display:flex; gap:6px; flex-shrink:0">
                  ${tab === 'active' ? `
                    <button class="icon-btn" style="width:32px; height:32px" onclick="App.editProduct('${p.id}')" aria-label="Edit ${escapeHTML(p.name)}" title="Edit">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button class="icon-btn" style="width:32px; height:32px" onclick="App.deleteProduct('${p.id}')" aria-label="Archive ${escapeHTML(p.name)}" title="Archive">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                    </button>
                  ` : `
                    <button class="icon-btn" style="width:32px; height:32px" onclick="App.restoreProduct('${p.id}')" aria-label="Restore ${escapeHTML(p.name)}" title="Restore">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>

  addProduct() {
    this.openProductModal(null);
  },

  editProduct(id) {
    const product = (Store.data.products || []).find(p => p.id === id);
    if (!product) { toast('Product not found'); return; }
    this.openProductModal(product);
  },

  openProductModal(product) {
    const p = product || null;
    showModal(`
      <h3 class="modal-title">${p ? 'Edit' : 'Add'} Product / Service</h3>
      <div class="form-group">
        <label class="form-label">Name</label>
        <input type="text" class="form-input" id="prod-name" placeholder="e.g. Full Interior Detailing" value="${p ? escapeHTML(p.name || '') : ''}">
      </div>
      <div class="form-group">
        <label class="form-label">Category (optional)</label>
        <input type="text" class="form-input" id="prod-category" placeholder="e.g. Upholstery, Detailing, Furniture" value="${p ? escapeHTML(p.category || '') : ''}">
      </div>
      <div class="form-group">
        <label class="form-label">Price</label>
        <input type="number" class="form-input" id="prod-price" placeholder="0" min="0" step="any" value="${p ? (Number(p.price) || 0) : ''}">
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <input type="text" class="form-input" id="prod-desc" placeholder="Short description" value="${p ? escapeHTML(p.description || '') : ''}">
      </div>
      <div style="display:flex; gap:8px; margin-top:8px">
        <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" style="flex:1" onclick="App.saveProduct(${p ? `'${p.id}'` : 'null'})">${p ? 'Save Changes' : 'Save'}</button>
      </div>
    `);
  },

  saveProduct(editId) {
    const name = document.getElementById('prod-name').value.trim();
    const category = (document.getElementById('prod-category') && document.getElementById('prod-category').value.trim()) || '';
    const price = parseFloat(document.getElementById('prod-price').value) || 0;
    const description = (document.getElementById('prod-desc') && document.getElementById('prod-desc').value.trim()) || '';
    if (!name) { toast('Name is required'); return; }
    if (!Store.data.products) Store.data.products = [];
    // Avoid exact-name duplicates (case-insensitive), except the item being edited.
    const exists = Store.data.products.find(p => !p.archived && p.id !== editId && (p.name || '').toLowerCase() === name.toLowerCase());
    if (exists) {
      toast('A product with that name already exists');
      return;
    }
    if (editId) {
      const product = Store.data.products.find(p => p.id === editId);
      if (!product) { toast('Product not found'); return; }
      product.name = name;
      product.category = category;
      product.description = description;
      product.price = price;
      product.updatedAt = Date.now();
      Store.save();
      closeModal();
      toast('Product updated');
      this.render();
      return;
    }
    Store.data.products.push({ id: uid(), name, category, description, price, archived: false, createdAt: Date.now() });
    Store.save();
    closeModal();
    toast('Product added to catalogue');
    this.render();
  },

  deleteProduct(id) {
    const product = (Store.data.products || []).find(p => p.id === id);
    if (!product) return;
    confirmDialog('Archive Product', `Remove "${product.name}" from the active catalogue? Historical invoices are not affected. You can restore it from the Archived tab.`, () => {
      product.archived = true;
      product.archivedAt = Date.now();
      Store.save();
      toast('Product archived');
      this.render();
    }, { confirmLabel: 'Archive Product' });
  },

  restoreProduct(id) {
    const product = (Store.data.products || []).find(p => p.id === id);
    if (!product) return;
    product.archived = false;
    delete product.archivedAt;
    product.updatedAt = Date.now();
    Store.save();
    toast('Product restored');
    this.render();
  },

  deleteProductPermanently(id) {
    const product = (Store.data.products || []).find(p => p.id === id);
    if (!product) return;
    confirmDialog('Delete Product Permanently', `Permanently delete "${product.name}"? This cannot be undone. Historical invoices keep their own item descriptions.`, () => {
      Store.data.products = (Store.data.products || []).filter(p => p.id !== id);
      Store.save();
      toast('Product deleted');
      this.render();
    }, { confirmLabel: 'Delete Forever' });
  },

          expenses.map(e => `
            <div class="card">
              <div class="list-item">
                <div class="list-item-info">
                  <div class="list-item-title">${escapeHTML(e.description || e.category || 'Expense')}</div>
                  <div class="list-item-sub">${formatDate(e.date)} · ${escapeHTML(e.category || 'General')}${e.note ? ' · ' + escapeHTML(e.note) : ''}</div>
                </div>
                <div style="text-align:right; display:flex; align-items:center; gap:8px;">
                  <div style="font-weight:700; font-size:14px; color:var(--warning)">${formatCurrency(e.amount)}</div>
                  <button class="icon-btn" style="width:32px;height:32px" onclick="App.deleteExpense('${e.id}')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                  </button>
                </div>
              </div>

          `).join('')}
      </div>
      ${this.bottomNav('settings')}
    </div>`;

  openExpenseModal(editId) {
    const e = editId ? (Store.data.expenses || []).find(x => x.id === editId) : null;
    const today = todayStr();
    showModal(`
      <h3 class="modal-title">${e ? 'Edit' : 'Add'} Expense</h3>
      <div class="form-group">
        <label class="form-label">Description</label>
        <input type="text" class="form-input" id="exp-desc" placeholder="e.g. Leather hides, Fuel, Thread" value="${e ? escapeHTML(e.description || '') : ''}">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Amount</label>
          <input type="number" class="form-input" id="exp-amount" placeholder="0" min="0" step="any" value="${e ? (e.amount || '') : ''}">
        </div>

    const category = document.getElementById('exp-category').value;

    if (!Store.data.expenses) Store.data.expenses = [];
    if (editId) {

      Store.data.expenses.push({

    closeModal();
    toast('Expense saved');

  async generatePrintHtml(docId) {
    // Reuse the existing printInvoice logic but return the HTML string
    const doc = [...Store.data.invoices, ...Store.data.quotes].find(d => d.id === docId);
    if (!doc) return null;
    // Temporarily call the internal builder by reusing printInvoice's construction
    // For simplicity we trigger the same DOM build then extract
    this.printInvoice(docId, true); // silent mode if we add it, else we extract from print-root
    return document.getElementById('print-root').innerHTML;
  },

  getDocument(docId) {
    return [...Store.data.invoices, ...Store.data.quotes].find(d => d.id === docId);
  },

  async buildPrintElement(docId) {
    const doc = this.getDocument(docId);
    if (!doc) throw new Error('Document not found');
    this.printInvoice(docId, { noPrint: true });
    const element = document.querySelector('#print-root .invoice-print');
    if (!element) throw new Error('Invoice layout not ready');
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (_) { /* ignore */ }
    return element;
  },

  async renderInvoiceCanvas(docId) {
    const element = await this.buildPrintElement(docId);
    const opt = {
      margin: [10, 10, 10, 10],
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    return html2pdf().set(opt).from(element).toCanvas().get('canvas');
  },

  async renderShareAsset(docId, format) {
    const doc = this.getDocument(docId);
    if (!doc) throw new Error('Document not found');
    const base = buildPrintFilename(doc);
    const canvas = await this.renderInvoiceCanvas(docId);
    const toJpegBlob = (quality) => new Promise((resolve, reject) => {
      canvas.toBlob(created => created ? resolve(created) : reject(new Error('Image render failed')), 'image/jpeg', quality);
    });

    if (format === 'pdf') {
      const jpegBlob = await toJpegBlob(0.94);
      const bytes = new Uint8Array(await jpegBlob.arrayBuffer());
      const pdfBlob = buildSinglePagePdf(bytes, canvas.width, canvas.height);
      const file = new File([pdfBlob], base + '.pdf', { type: 'application/pdf' });
      return { type: 'pdf', file, blob: pdfBlob, size: pdfBlob.size };
    }

    const blob = await toJpegBlob(0.92);
    const file = new File([blob], base + '.jpg', { type: 'image/jpeg' });
    return {
      type: 'image', file, blob, size: file.size,
      dataUrl: canvas.toDataURL('image/jpeg', 0.8),
      width: canvas.width, height: canvas.height
    };
  },

  saveBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },

  async downloadInvoicePDF(docId) {
    const doc = this.getDocument(docId);
    if (!doc) return;
    toast('Generating PDF…');
    try {
      const asset = await this.renderShareAsset(docId, 'pdf');
      this.saveBlob(asset.blob, asset.file.name);
      toast('PDF downloaded');
    } catch (e) {
      console.error(e);
      toast('PDF generation failed — try Print instead');
    }
  },

  async shareDocument(docId, format) {
    const doc = this.getDocument(docId);
    if (!doc) return;
    showModal(`
      <h3 class="modal-title">Preparing ${format === 'pdf' ? 'PDF' : 'image'}…</h3>
      <p style="color:var(--text-secondary); margin:0 0 16px; font-size:13px;">Rendering ${escapeHTML(doc.number)}. This takes a few seconds.</p>
      <div class="share-loading"><span class="spinner"></span></div>
    `);
    let asset;
    try {
      asset = await this.renderShareAsset(docId, format);
    } catch (e) {
      console.error(e);
      closeModal();
      toast('Could not prepare the document — try Print or Download PDF');
      return;
    }
    this._preparedShare = { docId, asset, at: Date.now() };
    const result = await this.tryShareFile(asset, doc);
    if (result === 'shared') {
      closeModal();
      toast(format === 'pdf' ? 'PDF shared' : 'Image shared');
      return;
    }
    if (result === 'cancelled') { closeModal(); return; }
    this.showShareReady(docId, asset, result);
  },

  async tryShareFile(asset, doc) {
    if (!navigator.share) return 'unsupported';
    if (navigator.canShare) {
      try {
        if (!navigator.canShare({ files: [asset.file] })) return 'unsupported';
      } catch (_) { return 'unsupported'; }
    }
    const isQuote = doc.type === 'quote';
    try {
      await navigator.share({
        files: [asset.file],
        title: `${isQuote ? 'Quotation' : 'Invoice'} ${doc.number}`,
        text: this.shareCaption(doc)
      });
      return 'shared';
    } catch (e) {
      if (e && e.name === 'AbortError') return 'cancelled';
      console.warn('Native share failed', e);
      return 'failed';
    }
  },

  shareCaption(doc) {
    const isQuote = doc.type === 'quote';
    const status = calculateStatus(doc);
    let text = `${isQuote ? 'Quotation' : 'Invoice'} ${doc.number} · ${formatCurrency(doc.total)}`;
    if (!isQuote && (Number(doc.balance) || 0) > 0) text += ` · Balance ${formatCurrency(doc.balance)}`;
    if (!isQuote && status === 'overdue') text += ' · OVERDUE';
    return text;
  },

  showShareReady(docId, asset, reason) {
    const isImage = asset.type === 'image';
    const sizeKb = Math.max(1, Math.round((asset.size || 0) / 1024));
    let canShare = false;
    if (navigator.share) {
      try { canShare = navigator.canShare ? navigator.canShare({ files: [asset.file] }) : true; } catch (_) { canShare = false; }
    }
    const note = canShare
      ? (reason === 'failed'
        ? 'The share sheet did not open. Tap Share to try again, or download the file.'
        : 'Tap Share to open your share sheet, then choose WhatsApp.')
      : 'Your browser cannot attach files directly. Download it, then attach it in WhatsApp.';
    showModal(`
      <h3 class="modal-title">${isImage ? 'Invoice image ready' : 'Invoice PDF ready'}</h3>
      ${isImage && asset.dataUrl
        ? `<div class="share-preview"><img src="${asset.dataUrl}" alt="Invoice preview"></div>`
        : `<div class="share-file-pill">
             <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
             <span>PDF document · ${sizeKb} KB</span>
           </div>`}
      <p class="share-note">${note}</p>
      <div class="share-actions">
        ${canShare ? `<button class="btn btn-primary" onclick="App.sharePrepared('${docId}', '${asset.type}')">Share</button>` : ''}
        <button class="btn btn-secondary" onclick="App.downloadPrepared('${docId}', '${asset.type}')">Download</button>
      </div>
      <button class="btn btn-secondary btn-block mb-8" onclick="App.sendDocumentText('${docId}')">Send as text instead</button>
      <button class="btn btn-secondary btn-block" onclick="closeModal()">Cancel</button>
    `);
  },

  async sharePrepared(docId, type) {
    const prepared = this._preparedShare;
    if (!prepared || prepared.docId !== docId || prepared.asset.type !== type) {
      this.shareDocument(docId, type);
      return;
    }
    const doc = this.getDocument(docId);
    if (!doc) return;
    const result = await this.tryShareFile(prepared.asset, doc);
    if (result === 'shared') {
      closeModal();
      toast(type === 'pdf' ? 'PDF shared' : 'Image shared');
      this._preparedShare = null;
    } else if (result === 'cancelled') {
      // Keep the sheet open so the user can try again.
    } else {
      toast('Could not open the share sheet — use Download instead');
    }
  },

  async downloadPrepared(docId, type) {
    const prepared = this._preparedShare;
    let asset = (prepared && prepared.docId === docId && prepared.asset.type === type) ? prepared.asset : null;
    if (!asset) {
      toast('Preparing file…');
      try {
        asset = await this.renderShareAsset(docId, type);
      } catch (e) {
        console.error(e);
        toast('Could not prepare the file');
        return;
      }
    }
    this.saveBlob(asset.blob, asset.file.name);
    toast(type === 'pdf' ? 'PDF downloaded' : 'Image downloaded — attach it in WhatsApp');
  },

  sendDocumentText(docId) {
    const doc = this.getDocument(docId);
    if (!doc) return;
    const b = Store.data.business;
    const isQuote = doc.type === 'quote';
    const status = calculateStatus(doc);
    let msg = `*${isQuote ? 'QUOTATION' : 'INVOICE'} from ${b.name}*\n`;
    msg += `No: ${doc.number}\nDate: ${formatDate(doc.date)}\n`;
    if (doc.customerName) msg += `Customer: ${doc.customerName}\n`;
    if (doc.vehicleMake || doc.vehicleModel) msg += `${doc.projectType || 'Project'}: ${[doc.vehicleMake, doc.vehicleModel, doc.vehicleReg].filter(Boolean).join(' ')}\n`;
    msg += `\n*Items:*\n`;
    (doc.items || []).forEach(it => {
      msg += `• ${it.description} — ${it.qty} × ${formatCurrency(it.price)} = ${formatCurrency(it.total)}\n`;
    });
    msg += `\nSubtotal: ${formatCurrency(doc.subtotal)}`;
    if (doc.tax > 0) msg += `\nTax (${doc.taxRate}%): ${formatCurrency(doc.tax)}`;
    msg += `\n*Total: ${formatCurrency(doc.total)}*`;
    if (!isQuote) {
      msg += `\nPaid: ${formatCurrency(doc.amountPaid)}\nBalance: ${formatCurrency(doc.balance)}`;
      msg += `\nStatus: ${statusLabel(status)}`;
    }
    if (b.paymentDetails) msg += `\n\nPayment details:\n${b.paymentDetails}`;
    msg += `\n\n${b.footerNotes || 'Thank you for your business.'}`;
    closeModal();
    const url = 'https://wa.me/?text=' + encodeURIComponent(msg);
    window.open(url, '_blank');

  shareEmail(docId) {
    const doc = [...Store.data.invoices, ...Store.data.quotes].find(d => d.id === docId);
    if (!doc) return;
    const b = Store.data.business;
    const isQuote = doc.type === 'quote';
    const subject = `${isQuote ? 'Quotation' : 'Invoice'} ${doc.number} from ${b.name}`;
    let body = `Dear ${doc.customerName || 'Customer'},\n\nPlease find details of your ${isQuote ? 'quotation' : 'invoice'} below.\n\n`;
    body += `Number: ${doc.number}\nDate: ${formatDate(doc.date)}\n`;
    if (doc.dueDate) body += `Due: ${formatDate(doc.dueDate)}\n`;
    body += `\nItems:\n`;
    (doc.items || []).forEach(it => {
      body += `- ${it.description}: ${it.qty} × ${formatCurrency(it.price)} = ${formatCurrency(it.total)}\n`;
    });
    body += `\nTotal: ${formatCurrency(doc.total)}\n`;
    if (!isQuote) body += `Paid: ${formatCurrency(doc.amountPaid)}\nBalance Due: ${formatCurrency(doc.balance)}\n`;
    if (b.paymentDetails) body += `\nPayment details:\n${b.paymentDetails}\n`;

    const mailto = `mailto:${encodeURIComponent(doc.customerEmail || '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  duplicateDocument(docId) {
    const src = [...Store.data.invoices, ...Store.data.quotes].find(d => d.id === docId);
    if (!src) return;
    const isQuote = src.type === 'quote';
    const b = Store.data.business;
    const prefix = isQuote ? b.quotePrefix : b.invoicePrefix;
    const nextNo = isQuote ? b.nextQuoteNo : b.nextInvoiceNo;
    const number = `${prefix}${String(nextNo).padStart(4, '0')}`;
    const newDoc = {
      id: uid(),
      number,
      type: src.type,
      customerId: src.customerId,
      customerName: src.customerName,
      customerPhone: src.customerPhone,
      customerEmail: src.customerEmail,
      customerAddress: src.customerAddress,
      projectType: src.projectType || 'Vehicle',
      vehicleMake: src.vehicleMake,
      vehicleModel: src.vehicleModel,
      vehicleReg: src.vehicleReg,
      date: todayStr(),
      dueDate: isQuote ? '' : addDaysStr(14),
      items: (src.items || []).map(it => ({ ...it })),
      taxRate: src.taxRate,
      subtotal: src.subtotal,
      tax: src.tax,
      total: src.total,
      amountPaid: 0,
      balance: src.total,
      status: isQuote ? 'draft' : 'sent',
      notes: src.notes || '',
      payments: [],
      createdAt: Date.now(),
      ...(isQuote ? {} : { stage: 'new', stageUpdatedAt: Date.now() }),
      duplicatedFrom: src.id
    };
    if (isQuote) {
      Store.data.quotes.push(newDoc);
      Store.data.business.nextQuoteNo = (Store.data.business.nextQuoteNo || 1) + 1;
    } else {
      Store.data.invoices.push(newDoc);
      Store.data.business.nextInvoiceNo = (Store.data.business.nextInvoiceNo || 1) + 1;
    }
    Store.save();
    toast(isQuote ? 'Quote duplicated' : 'Invoice duplicated');
    this.navigate('invoice-detail', { id: newDoc.id });
  },

  convertQuoteToInvoice(quoteId) {
    const q = Store.data.quotes.find(d => d.id === quoteId);
    if (!q) return;
    if (q.convertedToInvoiceId) {
      toast('This quotation was already converted');
      this.navigate('invoice-detail', { id: q.convertedToInvoiceId });
      return;
    }
    confirmDialog('Convert to Invoice', 'Create a new invoice from this quotation? The quotation will be kept for history.', () => {
      const b = Store.data.business;
      const number = `${b.invoicePrefix}${String(b.nextInvoiceNo).padStart(4, '0')}`;
      const inv = {
        id: uid(),
        number,
        type: 'invoice',
        customerId: q.customerId,
        customerName: q.customerName,
        customerPhone: q.customerPhone,
        customerEmail: q.customerEmail,
        customerAddress: q.customerAddress,
        projectType: q.projectType || 'Vehicle',
        vehicleMake: q.vehicleMake,
        vehicleModel: q.vehicleModel,
        vehicleReg: q.vehicleReg,
        date: todayStr(),
        dueDate: addDaysStr(14),
        items: (q.items || []).map(it => ({ ...it })),
        taxRate: q.taxRate,
        subtotal: q.subtotal,
        tax: q.tax,
        total: q.total,
        amountPaid: 0,
        balance: q.total,
        status: 'sent',
        notes: q.notes || '',
        payments: [],
        createdAt: Date.now(),
        stage: 'new', stageUpdatedAt: Date.now(),
        fromQuoteId: q.id
      };
      Store.data.invoices.push(inv);
      Store.data.business.nextInvoiceNo = (Store.data.business.nextInvoiceNo || 1) + 1;
      q.status = 'accepted';
      q.convertedToInvoiceId = inv.id;
      Store.save();
      toast('Invoice created from quotation');
      this.navigate('invoice-detail', { id: inv.id });
    }, { confirmLabel: 'Create Invoice', danger: false });
  },

  cancelInvoice(docId) {
    const doc = Store.data.invoices.find(d => d.id === docId);
    if (!doc) return;
    if (doc.status === 'cancelled') { toast('Already cancelled'); return; }
    if ((doc.amountPaid || 0) > 0) {
      toast('Cannot cancel an invoice with payments. Reverse payments first or issue a credit note.');
      return;
    }
    confirmDialog('Cancel Invoice', 'Mark this invoice as cancelled? It will be preserved for audit history and will no longer be editable as open.', () => {
      doc.status = 'cancelled';
      doc.cancelledAt = Date.now();
      Store.save();
      toast('Invoice cancelled');
      this.render();
    }, { confirmLabel: 'Cancel Invoice' });
  },

  printReceipt(docId) {
    const doc = Store.data.invoices.find(d => d.id === docId);
    if (!doc) return;
    const b = Store.data.business;
    const lastPayment = (doc.payments && doc.payments.length) ? doc.payments[doc.payments.length - 1] : null;
    const receiptHtml = `
      <div class="invoice-print" style="padding:24px 28px; min-height:auto;">
        <div style="text-align:center; margin-bottom:18px;">
          <div style="font-family:Georgia,serif; font-size:20px; font-weight:700; color:#a85f28;">${escapeHTML(b.name)}</div>
          <div style="font-size:11px; color:#6b5d50;">${escapeHTML(b.address || '')} · ${escapeHTML(b.phone || '')}</div>
          <div style="font-size:16px; font-weight:700; margin-top:12px; letter-spacing:2px;">PAYMENT RECEIPT</div>
        </div>
        <div style="border-top:1px dashed #c9a227; border-bottom:1px dashed #c9a227; padding:12px 0; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;"><span>Receipt for Invoice</span><strong>${escapeHTML(doc.number)}</strong></div>
          <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;"><span>Customer</span><strong>${escapeHTML(doc.customerName || 'Walk-in')}</strong></div>
          <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;"><span>Date</span><strong>${formatDate(lastPayment ? lastPayment.date : todayStr())}</strong></div>
          ${lastPayment ? `<div style="display:flex; justify-content:space-between; font-size:12px;"><span>Method</span><strong>${escapeHTML(lastPayment.method || '')}</strong></div>` : ''}
        </div>
        <div style="text-align:center; margin:18px 0;">
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#8a6a4d;">Amount Received</div>
          <div style="font-size:28px; font-weight:700; color:#15803d; font-family:Georgia,serif;">${formatCurrency(lastPayment ? lastPayment.amount : doc.amountPaid)}</div>
        </div>
        <div style="font-size:12px; margin-bottom:8px;">
          <div style="display:flex; justify-content:space-between;"><span>Invoice Total</span><span>${formatCurrency(doc.total)}</span></div>
          <div style="display:flex; justify-content:space-between;"><span>Total Paid to Date</span><span>${formatCurrency(doc.amountPaid)}</span></div>
          <div style="display:flex; justify-content:space-between; font-weight:700; margin-top:6px;"><span>Outstanding Balance</span><span>${formatCurrency(doc.balance)}</span></div>
        </div>
        <div style="margin-top:24px; text-align:center; font-size:10px; color:#6b5d50; border-top:1px dashed #c9a227; padding-top:12px;">
          Thank you · ${escapeHTML(b.name)} · Crafted Comfort
        </div>
      </div>
    `;
    const printRoot = document.getElementById('print-root');
    printRoot.innerHTML = receiptHtml;
    const previousTitle = document.title;
    document.title = `Receipt_${doc.number}_${todayStr()}`;
    const restore = () => { document.title = previousTitle; window.removeEventListener('afterprint', restore); };
    window.addEventListener('afterprint', restore);
    setTimeout(() => { window.print(); setTimeout(restore, 2000); }, 150);
  }
};

// ==================== Boot ====================
document.addEventListener('DOMContentLoaded', () => { App.init(); });
</script>
</body>
</html>
