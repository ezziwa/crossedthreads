<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<title>Crossed Threads — Invoicing</title>
<script src="js/dexie.min.js"></script>
<script src="js/html2pdf.bundle.min.js"></script>
<style>
:root {
  --bg: #14100d; --bg-secondary: #1a1613; --card: #1f1a16; --card-hover: #2a241e;
  --border: #3a3028; --border-light: #2a241e;
  --text: #f5efe6; --text-secondary: #a8998a; --text-tertiary: #6b5d50;
  --accent: #c17a3a; --accent-dark: #9a5d28; --accent-light: #d9a066; --accent-bg: rgba(193,122,58,0.14);
  --gold: #d4af37;
  --success: #6ecf87; --success-bg: rgba(110,207,135,0.14);
  --warning: #e0b45a; --warning-bg: rgba(224,180,90,0.14);
  --danger: #e06b5a; --danger-bg: rgba(224,107,90,0.14);
  --info: #7eb3d9; --info-bg: rgba(126,179,217,0.14);
  --shadow: 0 4px 12px rgba(0,0,0,0.35); --shadow-lg: 0 8px 24px rgba(0,0,0,0.45);
  --radius: 14px; --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="light"] {
  --bg: #faf7f2; --bg-secondary: #ffffff; --card: #ffffff; --card-hover: #f5efe6;
  --border: #e8dfd2; --border-light: #f0e9de;
  --text: #2a2118; --text-secondary: #7a6a58; --text-tertiary: #a8998a;
  --accent: #a85f28; --accent-dark: #7f4720; --accent-light: #c17a3a; --accent-bg: rgba(168,95,40,0.1);
  --gold: #a8861f;
  --success: #16a34a; --success-bg: rgba(22,163,74,0.1);
  --warning: #b45309; --warning-bg: rgba(180,83,9,0.1);
  --danger: #b91c1c; --danger-bg: rgba(185,28,28,0.1);
  --info: #2563eb; --info-bg: rgba(37,99,235,0.1);
  --shadow: 0 2px 8px rgba(0,0,0,0.06); --shadow-lg: 0 8px 24px rgba(0,0,0,0.1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
body { padding-bottom: calc(80px + var(--safe-bottom)); }
button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, textarea, select { font-family:inherit; font-size:inherit; }
#app { min-height:100vh; padding-top:var(--safe-top); }
.page { min-height:100vh; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.page-header { position:sticky; top:0; z-index:20; background:var(--bg); padding:14px 18px 12px;
  border-bottom:1px solid var(--border-light); backdrop-filter:blur(10px); }
.page-title { font-size:24px; font-weight:700; margin:0; letter-spacing:-0.5px; }
.page-subtitle { color:var(--text-secondary); font-size:13px; margin:2px 0 0; }
.page-body { padding:16px 18px; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.topbar .brand { display:flex; align-items:center; gap:10px; min-width:0; }
.brand-logo { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg, var(--accent), var(--accent-dark));
  display:grid; place-items:center; overflow:hidden; border:1px solid var(--border); flex-shrink:0; color:#fff; }
.brand-logo img { width:100%; height:100%; object-fit:cover; }
.brand-logo .placeholder { color:#fff; font-weight:700; font-size:16px; display:grid; place-items:center; width:100%; height:100%; }
.brand-name { font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:Georgia,serif; letter-spacing:0.2px; }
.brand-sub { font-size:11px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.icon-btn { width:40px; height:40px; border-radius:12px; background:var(--card); border:1px solid var(--border);
  display:grid; place-items:center; color:var(--text-secondary); transition:all 0.15s; flex-shrink:0; }
.icon-btn:active { transform:scale(0.94); background:var(--card-hover); }
.stats-block { background:linear-gradient(135deg, var(--card), var(--bg-secondary)); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px 18px; margin-bottom:16px; }
.stat-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; gap:12px; }
.stat-row + .stat-row { border-top:1px solid var(--border-light); }
.stat-label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary); font-weight:600; margin-bottom:4px; }
.stat-value { font-size:22px; font-weight:700; letter-spacing:-0.5px; }
.stat-value.success { color:var(--success); } .stat-value.warning { color:var(--warning); }
.action-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px; }
.action-card { border:1px solid var(--border); border-radius:var(--radius); padding:16px;
  text-align:left; display:flex; flex-direction:column; gap:10px; min-height:110px;
  transition:transform 0.15s; position:relative; overflow:hidden; }
.action-card:active { transform:scale(0.97); }
.action-card .icon { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; }
.action-card .label { font-weight:600; font-size:14px; }
.action-card .desc { font-size:11px; color:var(--text-secondary); }
.action-card.new-invoice { background:linear-gradient(135deg, #24301f, #1c2718); border-color:#3a4a2e; }
.action-card.new-invoice .icon { background:var(--success); color:#14100d; }
.action-card.new-quote { background:linear-gradient(135deg, #3a2a1a, #2d2114); border-color:#4a3a24; }
.action-card.new-quote .icon { background:var(--accent); color:#fff; }
.action-card.record-payment { background:linear-gradient(135deg, #2a1e1e, #2d1818); border-color:#3a2828; }
.action-card.record-payment .icon { background:#8b5a3c; color:#fff; }
.action-card.my-invoices { background:var(--card); }
.action-card.my-invoices .icon { background:var(--card-hover); color:var(--text); }
[data-theme="light"] .action-card.new-invoice { background:linear-gradient(135deg, #d1fae5, #a7f3d0); border-color:#6ee7b7; }
[data-theme="light"] .action-card.new-quote { background:linear-gradient(135deg, #fef3c7, #fde68a); border-color:#fcd34d; }
[data-theme="light"] .action-card.record-payment { background:linear-gradient(135deg, #fee2e2, #fecaca); border-color:#fca5a5; }
[data-theme="light"] .action-card .icon { color:#fff !important; }
.section { margin-bottom:20px; }
.section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.section-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-secondary); }
.section-link { font-size:13px; color:var(--accent); font-weight:600; }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; transition:background 0.15s; }
.card:active { background:var(--card-hover); }
.invoice-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; }
.invoice-item-info { flex:1; min-width:0; }
.invoice-item-number { font-weight:600; font-size:14px; margin-bottom:3px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.invoice-item-meta { font-size:12px; color:var(--text-secondary); }
.invoice-item-amount { text-align:right; font-weight:700; font-size:14px; }
.invoice-item-date { font-size:11px; color:var(--text-tertiary); margin-top:3px; }
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:100px;
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; }
.badge-paid { background:var(--success-bg); color:var(--success); }
.badge-partly { background:var(--warning-bg); color:var(--warning); }
.badge-sent, .badge-unpaid { background:var(--info-bg); color:var(--info); }
.badge-overdue { background:var(--danger-bg); color:var(--danger); }
.badge-draft { background:rgba(139,149,167,0.12); color:var(--text-secondary); }
.badge-quote { background:var(--accent-bg); color:var(--accent); }
.tabs { display:flex; background:var(--bg-secondary); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:14px; }
.tab { flex:1; text-align:center; padding:9px; border-radius:9px; font-size:13px; font-weight:600;
  color:var(--text-secondary); transition:all 0.15s; }
.tab.active { background:var(--card); color:var(--text); box-shadow:var(--shadow); }
.chips { display:flex; gap:8px; overflow-x:auto; padding:4px 0 10px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { padding:7px 14px; border-radius:100px; background:var(--card); border:1px solid var(--border);
  font-size:12px; font-weight:600; color:var(--text-secondary); white-space:nowrap; flex-shrink:0; }
.chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.search-bar { position:relative; margin-bottom:12px; }
.search-bar input { width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
  padding:11px 14px 11px 40px; border-radius:12px; outline:none; font-size:14px; }
.search-bar input:focus { border-color:var(--accent); }
.search-bar svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); }
.bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--bg-secondary); border-top:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-around; padding:8px 12px calc(8px + var(--safe-bottom)); z-index:30; }
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px;
  color:var(--text-tertiary); font-size:10px; font-weight:600; border-radius:10px; }
.nav-item.active { color:var(--accent); }
.nav-fab { width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg, var(--accent), var(--accent-dark)); color:#fff;
  display:grid; place-items:center; margin-top:-22px; box-shadow:0 6px 16px rgba(193,122,58,0.45);
  border:4px solid var(--bg-secondary); }
.nav-fab:active { transform:scale(0.92); }
.form-group { margin-bottom:14px; }
.form-label { display:block; font-size:11px; font-weight:700; color:var(--text-secondary);
  margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
.form-input, .form-select, .form-textarea { width:100%; background:var(--card); border:1px solid var(--border);
  color:var(--text); padding:12px 14px; border-radius:12px; outline:none; font-size:15px; transition:border-color 0.15s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color:var(--accent); }
.form-textarea { resize:vertical; min-height:70px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px;
  border-radius:12px; font-weight:600; font-size:14px; transition:all 0.15s; border:1px solid transparent; }
.btn:active { transform:scale(0.97); }
.btn-primary { background:var(--accent); color:#fff; }
.btn-secondary { background:var(--card); color:var(--text); border-color:var(--border); }
.btn-success { background:var(--success); color:#14100d; }
.btn-danger { background:var(--danger-bg); color:var(--danger); }
.btn-block { width:100%; }
.btn-sm { padding:8px 14px; font-size:13px; }
.btn:disabled, .btn[disabled] { opacity:0.45; cursor:not-allowed; transform:none !important; }
.install-banner { display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, var(--accent), var(--accent-dark));
  color:#fff; border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; box-shadow:var(--shadow); }
.install-banner .install-icon { flex-shrink:0; opacity:0.9; }
.install-banner .install-text { flex:1; min-width:0; }
.install-banner .install-title { font-size:13px; font-weight:700; line-height:1.3; }
.install-banner .install-desc { font-size:11px; opacity:0.85; line-height:1.35; }
.install-banner .install-cta { background:#fff; color:var(--accent-dark); font-weight:700; font-size:12px;
  padding:8px 13px; border-radius:9px; flex-shrink:0; }
.install-banner .install-dismiss { color:#fff; opacity:0.75; width:26px; height:26px; display:grid; place-items:center; flex-shrink:0; }
.invoice-item-right { display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }
.row-delete { width:30px; height:30px; border-radius:9px; background:var(--danger-bg); color:var(--danger);
  display:grid; place-items:center; flex-shrink:0; transition:transform 0.15s; }
.row-delete:active { transform:scale(0.9); }
.danger-note { font-size:11px; color:var(--text-tertiary); margin:0; line-height:1.5; }
.settings-item.is-action { cursor:pointer; }
.settings-item.is-action:active { background:var(--card-hover); }
.settings-item-value.danger { color:var(--danger); font-weight:600; }
.items-table { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.items-table-head { display:grid; grid-template-columns:1fr 50px 90px 90px 30px; gap:6px;
  padding:10px 12px; background:var(--bg-secondary); font-size:10px; font-weight:700;
  text-transform:uppercase; letter-spacing:0.5px; color:var(--text-secondary); }
.items-table-row { display:grid; grid-template-columns:1fr 50px 90px 90px 30px; gap:6px;
  padding:8px 12px; border-top:1px solid var(--border-light); align-items:center; }
.item-input { background:transparent; border:1px solid transparent; color:var(--text); padding:6px 8px;
  border-radius:8px; outline:none; font-size:14px; width:100%; min-width:0; }
.item-input:focus { background:var(--bg-secondary); border-color:var(--border); }
.item-input.num { text-align:right; }
.item-desc-wrap { position:relative; min-width:0; }
.item-suggestions {
  position:absolute; left:0; right:0; top:100%; z-index:40;
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  box-shadow:var(--shadow-lg); max-height:200px; overflow-y:auto; display:none;
}
.item-suggestions.open { display:block; }
.item-suggestion {
  padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border-light);
  display:flex; justify-content:space-between; gap:8px; align-items:center;
}
.item-suggestion:last-child { border-bottom:none; }
.item-suggestion:hover, .item-suggestion.active { background:var(--accent-bg); }
.item-suggestion .sugg-name { font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item-suggestion .sugg-price { color:var(--accent); font-weight:700; font-size:12px; flex-shrink:0; }
.item-total { text-align:right; padding:0 8px; font-weight:600; font-size:14px; }
.item-remove { width:28px; height:28px; border-radius:8px; background:var(--danger-bg); color:var(--danger);
  display:grid; place-items:center; flex-shrink:0; }
.totals { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-top:12px; }
.total-row { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; }
.total-row.grand { border-top:1px solid var(--border); margin-top:6px; padding-top:12px; font-size:18px; font-weight:700; }
.total-row.paid { color:var(--success); }
.total-row.balance { color:var(--warning); font-weight:600; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:1000;
  display:flex; align-items:flex-end; justify-content:center; animation:fadeIn 0.2s; }
[data-theme="light"] .modal-overlay { background:rgba(0,0,0,0.4); }
.modal { background:var(--bg-secondary); width:100%; max-width:500px; border-radius:20px 20px 0 0;
  padding:20px; padding-bottom:calc(20px + var(--safe-bottom)); max-height:90vh; overflow-y:auto;
  animation:slideUp 0.25s; }
@keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
.modal-title { font-size:18px; font-weight:700; margin:0 0 14px; font-family:Georgia,serif; }
.modal-handle { width:40px; height:4px; background:var(--border); border-radius:100px; margin:0 auto 14px; }
.toast { position:fixed; bottom:calc(100px + var(--safe-bottom)); left:50%; transform:translateX(-50%);
  background:var(--card); border:1px solid var(--border); padding:12px 20px; border-radius:12px;
  z-index:1100; font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); animation:toastIn 0.25s; max-width:90%; }
@keyframes toastIn { from { transform:translate(-50%, 20px); opacity:0; } to { transform:translate(-50%, 0); opacity:1; } }
.empty-state { text-align:center; padding:40px 20px; color:var(--text-secondary); }
.empty-state svg { margin-bottom:12px; opacity:0.4; }
.empty-state p { margin:8px 0 16px; font-size:14px; }
.detail-header { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.detail-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.payment-history { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.payment-row { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-top:1px solid var(--border-light); }
.payment-row:first-child { border-top:none; }
.settings-section { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:16px; }
.settings-section-title { padding:14px 16px 6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.8px; color:var(--accent); }
.settings-item { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-top:1px solid var(--border-light); gap:12px; min-height:48px; }
.settings-item-label { font-size:14px; font-weight:500; flex:1; min-width:0; }
.settings-item-value { font-size:13px; color:var(--text-secondary); text-align:right; }
.settings-item input, .settings-item select, .settings-item textarea { background:transparent; border:none; color:var(--text); text-align:right; outline:none; font-size:14px; flex:1; max-width:60%; }
.settings-item textarea { resize:vertical; min-height:60px; text-align:left; max-width:100%; }
.logo-upload { display:flex; align-items:center; gap:14px; padding:14px 16px; border-top:1px solid var(--border-light); }
.logo-preview { width:60px; height:60px; border-radius:12px; background:var(--bg-secondary); border:1px solid var(--border); display:grid; place-items:center; overflow:hidden; flex-shrink:0; }
.logo-preview img { width:100%; height:100%; object-fit:cover; }
.logo-preview .placeholder { color:var(--text-tertiary); }
.theme-options { display:flex; gap:8px; padding:12px 16px; }
.theme-option { flex:1; text-align:center; padding:10px; border:1px solid var(--border); border-radius:10px; font-size:12px; font-weight:600; }
.theme-option.active { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); }
.print-container { display:none; }
@media print {
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
  body > *:not(.print-container) { display:none !important; }
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: white !important;
    color: black !important;
    width: 100% !important;
    height: auto !important;
    overflow: visible !important;
  }
  .print-container {
    display: block !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .invoice-print {
    width: 100% !important;
    max-width: 100% !important;
    min-height: auto !important;
    padding: 8mm 10mm !important;
    margin: 0 !important;
    box-shadow: none !important;
    border: none !important;
    page-break-after: auto;
  }
  .invoice-print::before {
    top: 4mm; left: 4mm; right: 4mm; bottom: 4mm;
  }
  .ct-header, .ct-parties, .ct-totals-wrap, .ct-payment-stamp, .ct-notes, .ct-pay-history, .ct-footer {
    page-break-inside: avoid !important;
  }
  .ct-table { page-break-inside: auto; }
  .ct-table thead { display: table-header-group; }
  .ct-table tr { page-break-inside: avoid; page-break-after: auto; }
  .ct-table th, .ct-table td { padding: 8px 10px !important; }
  @page {
    size: A4 portrait;
    margin: 10mm 12mm;
  }
}

/* ==================== CROSSED THREADS STAMP ==================== */
.payment-stamp-wrapper { flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:transform 0.2s ease; transform-origin:center; }

/* ==================== CROSSED THREADS PRINT INVOICE ==================== */
.invoice-print {
  background: #faf7f2;
  color: #2a2118;

        }

      console.error('Store load error', e);

      let restored = null;
      try {

        if (raw) restored = JSON.parse(raw);

        this.seedSampleData();
        needsPersist = true;

  },
  save() {

// ==================== Helpers ====================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function formatCurrency(amount, currency) {
  currency = currency || (Store.data && Store.data.business.currency) || 'UGX';
  const num = Number(amount) || 0;
  const hasDecimal = Math.abs(num - Math.round(num)) > 0.001;
  const formatted = num.toLocaleString('en-US', {
    minimumFractionDigits: hasDecimal ? 2 : 0,
    maximumFractionDigits: 2
  });
  return currency + ' ' + formatted;
}

function formatNumber(amount) {
  const num = Number(amount) || 0;
  const hasDecimal = Math.abs(num - Math.round(num)) > 0.001;
  return num.toLocaleString('en-US', { minimumFractionDigits: hasDecimal ? 2 : 0, maximumFractionDigits: 2 });
}

// Compact money for dashboard tiles: UGX 2.4M instead of UGX 2,395,400.
function formatCompactCurrency(amount, currency) {
  currency = currency || (Store.data && Store.data.business.currency) || 'UGX';
  const num = Number(amount) || 0;
  try {
    const formatted = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(num);
    return `${currency} ${formatted}`;
  } catch (_) {
    return `${currency} ${Math.round(num).toLocaleString('en-US')}`;
  }
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}

function formatStampDate(dateStr) {
  let d = dateStr ? new Date(dateStr) : new Date();
  if (isNaN(d.getTime())) d = new Date();
  const day = String(d.getDate()).padStart(2, '0');
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return `${day} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// Local calendar date (toISOString() is UTC and could show yesterday/tomorrow
// for Kampala users near midnight).
function todayStr() {
  const d = new Date();
  return dateToStr(d);
}

function getPinConfig() {
  const security = (Store.data && Store.data.security) || { pin: DEFAULT_PIN, enabled: true };
  const pin = String(security.pin || DEFAULT_PIN);
  return {
    pin,
    length: Math.max(4, Math.min(6, pin.length)),
    enabled: security.enabled !== false
  };
}

// ==================== PIN recovery codes ====================
// A 16-character code = 80 random bits. Only its SHA-256 hash is stored, so a
// lost code cannot be recovered from the app data.
const RECOVERY_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 32 chars, no I/O/0/1

function generateRecoveryCode() {
  const bytes = new Uint8Array(16);
  window.crypto.getRandomValues(bytes);
  let code = '';
  for (let i = 0; i < bytes.length; i++) code += RECOVERY_ALPHABET[bytes[i] & 31];
  return code;
}

function normalizeRecoveryCode(code) {
  return String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function formatRecoveryCode(code) {
  const clean = normalizeRecoveryCode(code);
  return clean.replace(/(.{4})(?=.)/g, '$1-');
}

async function hashRecoveryCode(code) {
  const normalized = normalizeRecoveryCode(code);
  const subtle = window.crypto && window.crypto.subtle;
  if (!subtle) throw new Error('Secure https connection required for recovery codes');
  const data = new TextEncoder().encode('crossed-threads-recovery-v1:' + normalized);
  const digest = await subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
}

function dateToStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addDaysStr(days) {
  const d = new Date();
  d.setDate(d.getDate() + Number(days || 0));
  return dateToStr(d);
}

// ========== REVISION 2: Build a safe human-readable PDF filename ==========
function buildPrintFilename(doc) {
  const vehicle = [doc.vehicleMake, doc.vehicleModel].filter(Boolean).join(' ').trim();
  const base = vehicle || (doc.type === 'quote' ? 'Quotation' : 'Invoice');
  const number = doc.number || (doc.type === 'quote' ? 'QUOTE' : 'INVOICE');
  const datePart = doc.date || todayStr();
  return `${base}_${number}_${datePart}`
    .replace(/[\\/:*?"<>|\n\r\t]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function calculateStatus(doc) {
  if (doc.status === 'cancelled') return 'cancelled';
  if (doc.type === 'quote') {
    if (doc.status === 'accepted' || doc.convertedToInvoiceId) return 'accepted';
    if (doc.status === 'rejected') return 'rejected';
    if (doc.status === 'expired') return 'expired';
    if (doc.status === 'sent') return 'sent';
    return 'draft';
  }
  if (doc.amountPaid >= doc.total && doc.total > 0) return 'paid';
  if (doc.amountPaid > 0 && doc.amountPaid < doc.total) {
    if (doc.dueDate && new Date(doc.dueDate) < new Date(todayStr())) return 'overdue';
    return 'partly';
  }
  if (doc.dueDate && new Date(doc.dueDate) < new Date(todayStr())) return 'overdue';
  return 'sent';
}

function statusLabel(status) {
  return {
    paid:'PAID', partly:'PARTLY PAID', sent:'SENT', overdue:'OVERDUE',
    draft:'DRAFT', unpaid:'NOT PAID', cancelled:'CANCELLED',
    accepted:'ACCEPTED', rejected:'REJECTED', expired:'EXPIRED'
  }[status] || (status || '').toUpperCase();
}

function statusBadgeClass(status) {
  return {
    paid:'badge-paid', partly:'badge-partly', sent:'badge-sent', overdue:'badge-overdue',
    draft:'badge-draft', unpaid:'badge-unpaid', cancelled:'badge-overdue',
    accepted:'badge-paid', rejected:'badge-overdue', expired:'badge-draft'
  }[status] || 'badge-draft';
}

// ==================== Workshop job stages ====================
const JOB_STAGES = [
  { key: 'new', label: 'New Job', short: 'New' },
  { key: 'deposit', label: 'Deposit Paid', short: 'Deposit' },
  { key: 'materials', label: 'Materials Ordered', short: 'Materials' },
  { key: 'workshop', label: 'In Workshop', short: 'Workshop' },
  { key: 'ready', label: 'Ready for Pickup', short: 'Ready' },
  { key: 'delivered', label: 'Delivered', short: 'Delivered' }
];

function jobStageIndex(key) {
  return Math.max(0, JOB_STAGES.findIndex(stage => stage.key === key));
}

function jobStageLabel(key) {
  const stage = JOB_STAGES.find(item => item.key === key);
  return stage ? stage.label : 'New Job';
}

function nextJobStage(key) {
  const index = JOB_STAGES.findIndex(stage => stage.key === key);
  return index >= 0 ? JOB_STAGES[index + 1] || null : JOB_STAGES[1];
}

function inferProjectType(doc) {
  const text = `${doc.vehicleMake || ''} ${doc.vehicleModel || ''} ${doc.vehicleReg || ''}`.toLowerCase();
  if (/boat|marine|yacht|vessel|outboard/.test(text)) return 'Boat';
  if (/interior|curtain|blind|wall panel|headboard/.test(text)) return 'Custom Interior';
  if (/sofa|chair|furniture|upholst|cushion|bed|ottoman|stool|settee/.test(text)) return 'Upholstery Project';
  return 'Vehicle';
}

// Build a guaranteed single-page A4 PDF around one rendered JPEG.
function buildSinglePagePdf(jpegBytes, imageWidth, imageHeight) {
  const pageW = 595.28;
  const pageH = 841.89;
  const margin = 22.68; // 8 mm
  const maxW = pageW - margin * 2;
  const maxH = pageH - margin * 2;
  const scale = Math.min(maxW / imageWidth, maxH / imageHeight);
  const drawW = imageWidth * scale;
  const drawH = imageHeight * scale;
  const x = (pageW - drawW) / 2;
  const y = (pageH - drawH) / 2;
  const encoder = new TextEncoder();
  const parts = [];
  const offsets = [];
  let position = 0;

  const append = (data) => {
    const bytes = typeof data === 'string' ? encoder.encode(data) : data;
    parts.push(bytes);
    position += bytes.length;
  };
  const beginObject = (number) => {
    offsets[number] = position;
    append(`${number} 0 obj\n`);
  };
  const endObject = () => append('\nendobj\n');

  append('%PDF-1.4\n');
  append(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));

  beginObject(1);
  append('<< /Type /Catalog /Pages 2 0 R >>');
  endObject();

  beginObject(2);
  append('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  endObject();

  beginObject(3);
  append(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW.toFixed(2)} ${pageH.toFixed(2)}] /Resources << /XObject << /Im0 4 0 R >> /ProcSet [/PDF /ImageC] >> /Contents 5 0 R >>`);
  endObject();

  beginObject(4);
  append(`<< /Type /XObject /Subtype /Image /Width ${Math.round(imageWidth)} /Height ${Math.round(imageHeight)} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
  append(jpegBytes);
  append('\nendstream');
  endObject();

  const content = [
    'q',
    '1 1 1 rg',
    `0 0 ${pageW.toFixed(2)} ${pageH.toFixed(2)} re f`,
    'Q',
    'q',
    `${drawW.toFixed(2)} 0 0 ${drawH.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm`,
    '/Im0 Do',
    'Q',
    ''
  ].join('\n');
  beginObject(5);
  append(`<< /Length ${encoder.encode(content).length} >>\nstream\n${content}endstream`);
  endObject();

  const xrefOffset = position;
  append('xref\n0 6\n');
  append('0000000000 65535 f \n');
  for (let i = 1; i <= 5; i++) {
    append(String(offsets[i]).padStart(10, '0') + ' 00000 n \n');
  }
  append(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}

function escapeHTML(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function toast(message) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.25s'; setTimeout(() => el.remove(), 250); }, 2200);
}

// The confirm callback used to be stringified into an inline onclick, which lost
// its closure (id/doc/this were undefined) and silently broke every delete action.
// Keep the real function in a variable and bind it with addEventListener instead.
let _confirmAction = null;

function showModal(html) {
  _confirmAction = null;
  document.getElementById('modal-root').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal"><div class="modal-handle"></div>${html}</div></div>`;
}
function closeModal() {
  _confirmAction = null;
  document.getElementById('modal-root').innerHTML = '';
}

function confirmDialog(title, message, onConfirm, opts) {
  opts = opts || {};
  const confirmLabel = opts.confirmLabel || 'Delete';
  const cancelLabel = opts.cancelLabel || 'Cancel';
  const danger = opts.danger !== false;
  const requireText = (opts.requireText || '').toString();
  showModal(`
    <h3 class="modal-title">${escapeHTML(title)}</h3>
    <p style="color:var(--text-secondary); margin:0 0 18px; font-size:14px; line-height:1.55; white-space:pre-line;">${escapeHTML(message)}</p>
    ${requireText ? `<div class="form-group">
      <label class="form-label">Type ${escapeHTML(requireText)} to confirm</label>
      <input type="text" class="form-input" id="confirm-typed" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${escapeHTML(requireText)}">
    </div>` : ''}
    <div style="display:flex; gap:8px;">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">${escapeHTML(cancelLabel)}</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" style="flex:1" id="confirm-dialog-ok" ${requireText ? 'disabled' : ''}>${escapeHTML(confirmLabel)}</button>
    </div>
  `);
  _confirmAction = typeof onConfirm === 'function' ? onConfirm : null;
  const okBtn = document.getElementById('confirm-dialog-ok');
  if (!okBtn) return;
  if (requireText) {
    const typed = document.getElementById('confirm-typed');
    if (typed) {
      typed.addEventListener('input', () => {
        okBtn.disabled = typed.value.trim().toUpperCase() !== requireText.toUpperCase();
      });
      setTimeout(() => typed.focus(), 60);
    }
  }
  okBtn.addEventListener('click', async () => {
    const action = _confirmAction;
    closeModal();
    if (!action) return;
    try {
      await action();
    } catch (e) {
      console.error('Confirmed action failed', e);
      toast('Something went wrong — please try again');
    }
  });
}

const APP_VERSION = '1.5.0';

function compareVersions(a, b) {
  const pa = String(a || '0').split('.').map(v => parseInt(v, 10) || 0);
  const pb = String(b || '0').split('.').map(v => parseInt(v, 10) || 0);
  const length = Math.max(pa.length, pb.length);
  for (let i = 0; i < length; i++) {
    const diff = (pa[i] || 0) - (pb[i] || 0);
    if (diff !== 0) return diff > 0 ? 1 : -1;
  }
  return 0;
}

const Install = {
  deferredPrompt: null,
  installed: false,

  get standalone() {
    return window.matchMedia('(display-mode: standalone)').matches ||
      window.matchMedia('(display-mode: fullscreen)').matches ||
      window.navigator.standalone === true;
  },

  get isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  },

  get platformHint() {
    if (this.isIOS) return 'iPhone / iPad: tap the Share button, then “Add to Home Screen”.';
    if (/android/i.test(navigator.userAgent)) return 'Android: tap Install, or use the browser menu → “Install app” / “Add to Home screen”.';
    return 'Desktop: click the install icon in the address bar, or the browser menu → “Install Crossed Threads”.';
  },

  init() {
    this.installed = this.standalone;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      this.deferredPrompt = e;
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'flex';
    });
    window.addEventListener('appinstalled', () => {
      this.installed = true;
      this.deferredPrompt = null;
      toast('App installed — launch it from your home screen');
      if (App.state.view === 'home' || App.state.view === 'settings') App.render();
    });
  },

  showBanner() {
    if (this.installed) return false;
    try { if (localStorage.getItem('ct_install_dismissed') === '1') return false; } catch (_) { /* ignore */ }
    return true;
  },

  dismiss() {
    try { localStorage.setItem('ct_install_dismissed', '1'); } catch (_) { /* ignore */ }
    const banner = document.getElementById('install-banner');
    if (banner) banner.remove();
  },

  bannerHtml() {
    if (!this.showBanner()) return '';
    return `<div class="install-banner" id="install-banner">
      <div class="install-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="2" width="12" height="20" rx="3"/><line x1="11" y1="18" x2="13" y2="18"/>

      <div class="install-text">
        <div class="install-title">Add Crossed Threads to your home screen</div>

      </div>
      <button class="install-cta" onclick="Install.prompt()">Install</button>
      <button class="install-dismiss" onclick="Install.dismiss()" aria-label="Dismiss install banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;
  },

  async prompt() {
    if (this.standalone) { toast('Already running as an installed app'); return; }
    if (this.deferredPrompt) {
      const evt = this.deferredPrompt;
      this.deferredPrompt = null;
      evt.prompt();
      try {
        const choice = await evt.userChoice;
        if (choice && choice.outcome === 'accepted') toast('Installing app…');
        else toast('Install cancelled — try again from Settings');
      } catch (_) { /* ignore */ }
      return;
    }
    this.showInstructions();

  showInstructions() {
    const ios = this.isIOS;

const App = {
  state: { view: 'home', params: {}, invoiceTab: 'invoices', filter: 'all', search: '', pinInput: '', homePeriod: 'month', productTab: 'active', updateInfo: null },

  isLocked() {
    const sec = (Store.data && Store.data.security) || { pin: DEFAULT_PIN, enabled: true };
    if (sec.enabled === false) return false;
    return sessionStorage.getItem('crossed_threads_unlocked') !== 'true';
  },

  async init() {
    Install.init();
    // Request persistent storage to reduce eviction risk
    if (navigator.storage && navigator.storage.persist) {
      try {
        const granted = await navigator.storage.persist();
        console.log('Persistent storage:', granted ? 'granted' : 'not granted');
      } catch (e) { /* ignore */ }
    }
    // Register Service Worker (handles GitHub Pages subpaths via relative URLs)
    if ('serviceWorker' in navigator) {
      try {
        const hadController = !!navigator.serviceWorker.controller;
        let updatePrompted = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (this._manualUpdate) return;
          if (!hadController || updatePrompted) return;
          updatePrompted = true;
          confirmDialog(
            'Update Available',
            'A new version of Crossed Threads is ready. Reload now to use it? Saved invoices and settings are not affected.',

          const worker = reg.installing;
          if (!worker) return;

  pressPin(key) {
    const pinConfig = getPinConfig();
    const pinLength = pinConfig.length;
    if (!this.state.pinInput) this.state.pinInput = '';
    if (key === 'C') this.state.pinInput = '';
    else if (key === 'DEL') this.state.pinInput = this.state.pinInput.slice(0, -1);
    else if (typeof key === 'string' && key.length === 1 && key >= '0' && key <= '9') {
      if (this.state.pinInput.length < pinLength) this.state.pinInput += key;
    }

    const dotsContainer = document.getElementById('pin-dots-container');
    if (dotsContainer) {
      const dots = dotsContainer.children;
      for (let i = 0; i < dots.length; i++) {
        if (i < this.state.pinInput.length) dots[i].classList.add('filled');
        else dots[i].classList.remove('filled');
      }
    }

    if (this.state.pinInput.length === pinLength) {
      if (this.state.pinInput === pinConfig.pin) {
        sessionStorage.setItem('crossed_threads_unlocked', 'true');
        this.state.pinInput = '';
        toast('Unlocked');
        this.render();
        this.handleLaunchHash();
      } else {
        if (dotsContainer) {
          dotsContainer.classList.add('shake');
          setTimeout(() => dotsContainer.classList.remove('shake'), 400);
        }
        toast('Incorrect PIN');
        this.state.pinInput = '';
        setTimeout(() => {
          if (dotsContainer) [...dotsContainer.children].forEach(d => d.classList.remove('filled'));
        }, 300);
      }
    }
  },

  setupKeypadListener() {
    window.addEventListener('keydown', (e) => {
      if (!this.isLocked()) return;
      if (e.key >= '0' && e.key <= '9') this.pressPin(e.key);
      else if (e.key === 'Backspace') this.pressPin('DEL');
      else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') this.pressPin('C');
    });
  },

  lockApp() {
    sessionStorage.removeItem('crossed_threads_unlocked');
    this.state.pinInput = '';
    toast('App Locked');
    this.renderLockScreen();

  applyTheme() {
    const theme = Store.data.theme || 'dark';
    if (theme === 'auto') {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
  },

  // ==================== Home dashboard helpers ====================
  setHomePeriod(period) {
    if (!['today', 'month', 'last-month', 'year'].includes(period)) return;
    this.state.homePeriod = period;
    this.render();
  },

  inPeriod(dateStr, period) {
    if (!dateStr) return false;
    let d;
    const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(dateStr));
    if (match) d = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    else d = new Date(dateStr);
    if (isNaN(d.getTime())) return false;
    const now = new Date();
    if (period === 'today') return dateToStr(d) === todayStr();
    if (period === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    if (period === 'last-month') {
      const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      return d.getFullYear() === prev.getFullYear() && d.getMonth() === prev.getMonth();
    }
    if (period === 'year') return d.getFullYear() === now.getFullYear();
    return true;
  },

  homeMetrics(period) {
    const invoices = (Store.data.invoices || []).filter(doc => calculateStatus(doc) !== 'cancelled');
    let invoiced = 0, invoiceCount = 0, collected = 0, paymentCount = 0, expenses = 0, expenseCount = 0;
    invoices.forEach(doc => {
      if (this.inPeriod(doc.date, period)) {
        invoiced += Number(doc.total) || 0;
        invoiceCount++;
      }
      const payments = Array.isArray(doc.payments) ? doc.payments : [];
      if (payments.length > 0) {
        payments.forEach(payment => {
          if (this.inPeriod(payment.date || doc.date, period)) {
            collected += Number(payment.amount) || 0;
            paymentCount++;
          }
        });
      } else if (this.inPeriod(doc.date, period)) {
        const paid = Number(doc.amountPaid) || 0;
        if (paid > 0) { collected += paid; paymentCount++; }
      }
    });
    (Store.data.expenses || []).forEach(expense => {
      const dateStr = expense.date || (expense.createdAt ? dateToStr(new Date(expense.createdAt)) : '');
      if (this.inPeriod(dateStr, period)) {
        expenses += Number(expense.amount) || 0;
        expenseCount++;
      }
    });
    let outstanding = 0, overdueCount = 0, overdueAmount = 0;
    invoices.forEach(doc => {
      const balance = Math.max(0, (Number(doc.total) || 0) - (Number(doc.amountPaid) || 0));
      outstanding += balance;
      if (calculateStatus(doc) === 'overdue') {
        overdueCount++;
        overdueAmount += balance;
      }
    });
    return {
      invoiced, invoiceCount, collected, paymentCount, expenses, expenseCount,
      profit: invoiced - expenses, outstanding, overdueCount, overdueAmount
    };
  },

  attentionItems(metrics) {
    const items = [];
    const updateInfo = this.state.updateInfo;
    if (updateInfo && compareVersions(updateInfo.version, APP_VERSION) > 0) {
      items.push({
        key: 'update',
        tone: 'var(--accent)', bg: 'var(--accent-bg)',
        title: `Update available — v${updateInfo.version}`,
        sub: 'Tap to see what’s new and reload',
        amount: '',
        action: `App.showUpdateDialog(App.state.updateInfo)`
      });
    }
    if (metrics.overdueCount > 0) {
      items.push({
        key: 'overdue',
        tone: 'var(--danger)', bg: 'var(--danger-bg)',
        title: `${metrics.overdueCount} overdue invoice${metrics.overdueCount === 1 ? '' : 's'}`,
        sub: 'Tap to review and chase payment',
        amount: formatCompactCurrency(metrics.overdueAmount),
        action: `App.showOverdue()`
      });
    }
    const staleQuotes = (Store.data.quotes || []).filter(quote => {
      const status = calculateStatus(quote);
      if (status !== 'sent' && status !== 'draft') return false;
      return quote.createdAt && (Date.now() - quote.createdAt) > 7 * 86400000;
    });
    if (staleQuotes.length > 0) {
      const value = staleQuotes.reduce((sum, quote) => sum + (Number(quote.total) || 0), 0);
      items.push({
        key: 'quotes',
        tone: 'var(--accent)', bg: 'var(--accent-bg)',
        title: `${staleQuotes.length} quote${staleQuotes.length === 1 ? '' : 's'} awaiting follow-up`,
        sub: 'Sent more than a week ago',
        amount: formatCompactCurrency(value),
        action: `App.showQuotes()`
      });
    }
    const dueJobs = this.activeJobs().filter(job => job.dueDate && job.dueDate <= addDaysStr(3));
    if (dueJobs.length > 0) {
      items.push({
        key: 'jobs',
        tone: 'var(--warning)', bg: 'var(--warning-bg)',
        title: `${dueJobs.length} job${dueJobs.length === 1 ? '' : 's'} due within 3 days`,
        sub: 'Check the workshop schedule',
        amount: '',
        action: `App.scrollToJobs()`
      });
    }
    const lastBackup = Number(Store.data.lastBackupAt) || 0;
    const backupAgeDays = lastBackup ? Math.floor((Date.now() - lastBackup) / 86400000) : null;
    if (!lastBackup || backupAgeDays >= 7) {
      items.push({
        key: 'backup',
        tone: 'var(--info)', bg: 'var(--info-bg)',
        title: 'Back up your data',
        sub: lastBackup
          ? `Last backup ${backupAgeDays === 0 ? 'today' : backupAgeDays + ' day' + (backupAgeDays === 1 ? '' : 's') + ' ago'}`
          : 'No backup yet — data lives only on this phone',
        amount: '',
        action: `App.downloadBackup()`
      });
    }
    const pinConfig = getPinConfig();
    if (pinConfig.enabled && (pinConfig.pin === DEFAULT_PIN || pinConfig.pin === '1234')) {
      items.push({
        key: 'pin',
        tone: 'var(--danger)', bg: 'var(--danger-bg)',
        title: `Your PIN is still ${pinConfig.pin}`,
        sub: 'Change it to 4–6 digits in Settings → Security',
        amount: '',
        action: `App.navigate('settings')`
      });
    }
    const security = Store.data.security || {};
    if (security.pin && security.pin !== DEFAULT_PIN && security.pin !== '1234' && !security.recoveryHash) {
      items.push({
        key: 'recovery',
        tone: 'var(--info)', bg: 'var(--info-bg)',
        title: 'Create a PIN recovery code',
        sub: 'Needed if you ever forget your PIN',
        amount: '',
        action: `App.navigate('settings')`
      });
    }
    return items;
  },

  activeJobs() {
    return (Store.data.invoices || [])
      .filter(doc => calculateStatus(doc) !== 'cancelled')
      .filter(doc => (doc.stage || 'new') !== 'delivered')
      .sort((a, b) => (a.dueDate || '9999-12-31').localeCompare(b.dueDate || '9999-12-31') || (b.createdAt || 0) - (a.createdAt || 0));

  // ==================== Invoices List ====================
  renderInvoices() {
    const tab = this.state.invoiceTab || 'invoices';
    const filter = this.state.filter || 'all';
    const search = (this.state.search || '').toLowerCase();
    let docs = tab === 'invoices' ? Store.data.invoices : Store.data.quotes;

    let filtered = docs.filter(d => {
      const status = calculateStatus(d);
      if (filter === 'all') {}
      else if (filter === 'unpaid') { if (status !== 'sent' && status !== 'overdue') return false; }
      else if (filter === 'outstanding') { if (status === 'paid' || status === 'cancelled') return false; }
      else if (filter === 'partly') { if (status !== 'partly') return false; }
      else if (filter === 'paid') { if (status !== 'paid') return false; }
      else if (filter === 'overdue') { if (status !== 'overdue') return false; }
      else if (filter === 'this-month') {
        const dObj = new Date(d.date);
        const now = new Date();
        if (dObj.getMonth() !== now.getMonth() || dObj.getFullYear() !== now.getFullYear()) return false;
      }
      if (search) {
        const text = (d.number + ' ' + (d.customerName || '') + ' ' + status).toLowerCase();
        if (!text.includes(search)) return false;
      }
      return true;
    });
    filtered.sort((a,b) => b.createdAt - a.createdAt);

    const filters = ['all','unpaid','outstanding','partly','paid','overdue','this-month'];
    const filterLabels = { all:'All', unpaid:'Not Paid', outstanding:'Outstanding', partly:'Partly Paid', paid:'Paid', overdue:'Overdue', 'this-month':'This Month' };

    return `<div class="page">

  renderInvoiceForm() {
    const id = this.state.params.id;
    const isEdit = !!id;
    const doc = isEdit ? [...Store.data.invoices, ...Store.data.quotes].find(d => d.id === id) : null;
    const isQuote = doc ? doc.type === 'quote' : (this.state.params.type === 'quote');
    const business = Store.data.business;

    const prefix = isQuote ? business.quotePrefix : business.invoicePrefix;
    const nextNo = isQuote ? business.nextQuoteNo : business.nextInvoiceNo;
    const number = doc ? doc.number : `${prefix}${String(nextNo).padStart(4, '0')}`;

    const today = doc ? doc.date : todayStr();
    const dueDate = doc ? doc.dueDate : addDaysStr(14);

    const customer = doc ? { id: doc.customerId, name: doc.customerName, phone: doc.customerPhone, email: doc.customerEmail, address: doc.customerAddress } : null;
    const items = doc ? doc.items : [{ description: '', qty: 1, price: 0, total: 0 }];
    const taxRate = doc ? doc.taxRate : business.defaultTax;
    const notes = doc ? doc.notes : '';
    const projectType = doc ? (doc.projectType || 'Vehicle') : 'Vehicle';
    const makeLabel = this.projectMakeLabel(projectType);

    return `<div class="page">
      <div class="page-header">
        <div class="topbar">
          <button class="back-btn" onclick="App.navigate('${isEdit ? 'invoice-detail' : 'invoices'}', ${isEdit ? `{id:'${id}'}` : `{}`})">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            ${isEdit ? 'Cancel' : 'Back'}
          </button>
          <h1 style="font-size:17px; font-weight:700; margin:0">${isEdit ? 'Edit' : 'New'} ${isQuote ? 'Quote' : 'Invoice'}</h1>
          <button class="btn btn-primary btn-sm" onclick="App.saveDocument('${isQuote ? 'quote' : 'invoice'}', ${isEdit ? `'${id}'` : 'null'})">Save</button>
        </div>
      </div>
      <div class="page-body" style="padding-bottom:100px">
        <div class="form-group">
          <label class="form-label">Customer</label>
          <select class="form-select" id="customer-select" onchange="App.onCustomerChange()">
            <option value="">— Select customer —</option>
            <option value="new">+ Add new customer</option>
            ${Store.data.customers.map(c => `<option value="${c.id}" ${customer && customer.id === c.id ? 'selected' : ''}>${escapeHTML(c.name)}${c.phone ? ' — ' + escapeHTML(c.phone) : ''}</option>`).join('')}
          </select>
        </div>

        <div id="new-customer-fields" style="display:none">
          <div class="form-group">
            <input type="text" class="form-input" id="new-customer-name" placeholder="Customer name">
          </div>
          <div class="form-row">
            <input type="tel" class="form-input" id="new-customer-phone" placeholder="Phone">
            <input type="email" class="form-input" id="new-customer-email" placeholder="Email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Project Type</label>
          <select class="form-select" id="project-type" onchange="App.onProjectTypeChange()">
            ${['Vehicle', 'Boat', 'Upholstery Project', 'Custom Interior'].map(type => `<option value="${type}" ${projectType === type ? 'selected' : ''}>${type}</option>`).join('')}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Project Reference</label>
          <div class="form-row">
            <div>
              <label class="form-label" id="veh-make-label">${makeLabel}</label>
              <input type="text" class="form-input" id="veh-make" placeholder="Name" value="${escapeHTML(doc ? (doc.vehicleMake||'') : '')}">
            </div>
            <div>
              <label class="form-label" id="veh-model-label">Model</label>
              <input type="text" class="form-input" id="veh-model" placeholder="Model / Type" value="${escapeHTML(doc ? (doc.vehicleModel||'') : '')}">
            </div>
          </div>
          <label class="form-label" id="veh-reg-label" style="margin-top:8px">Ref / Reg</label>
          <input type="text" class="form-input" id="veh-reg" placeholder="Registration / Ref (e.g. UBA 123X)" style="text-transform:uppercase" value="${escapeHTML(doc ? (doc.vehicleReg||'') : '')}">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Document #</label>
            <input type="text" class="form-input" id="doc-number" value="${escapeHTML(number)}">
          </div>
          <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" class="form-input" id="doc-date" value="${today}">
          </div>
        </div>

        ${!isQuote ? `<div class="form-group">
          <label class="form-label">Due Date</label>
          <input type="date" class="form-input" id="doc-due-date" value="${dueDate}">
        </div>` : ''}

        <div class="section">
          <div class="section-head">
            <div class="section-title">Items</div>
            <button class="section-link" onclick="App.addItemRow()">+ Add item</button>
          </div>
          <div class="items-table">
            <div class="items-table-head">
              <div>Description</div><div>Qty</div><div>Price</div><div>Total</div><div></div>
            </div>
            <div id="items-list">
              ${items.map((item, i) => this.itemRow(item, i)).join('')}
            </div>
          </div>
          <div class="totals">
            <div class="total-row"><span>Subtotal</span><span id="subtotal-display">${formatCurrency(0)}</span></div>
            <div class="total-row">
              <span>Tax (<input type="number" id="tax-rate" value="${taxRate}" style="width:50px; background:transparent; border:1px solid var(--border); border-radius:6px; padding:2px 6px; color:var(--text); text-align:center" oninput="App.recalcTotals()">%)</span>
              <span id="tax-display">${formatCurrency(0)}</span>
            </div>
            <div class="total-row grand"><span>Total</span><span id="total-display">${formatCurrency(0)}</span></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Notes (optional)</label>
          <textarea class="form-textarea" id="doc-notes" placeholder="Additional notes for customer...">${escapeHTML(notes)}</textarea>
        </div>
      </div>
    </div>`;
  },

  itemRow(item, i) {
    return `<div class="items-table-row" data-item-index="${i}">
      <div class="item-desc-wrap">
        <input type="text" class="item-input item-desc" placeholder="Description (type to search catalogue)" value="${escapeHTML(item.description||'')}"
          oninput="App.onDescInput(${i}, this)" onfocus="App.onDescInput(${i}, this)" onblur="setTimeout(()=>App.hideSuggestions(${i}),180)" autocomplete="off">
        <div class="item-suggestions" id="sugg-${i}"></div>
      </div>
      <input type="number" class="item-input num" placeholder="1" value="${item.qty||1}" oninput="App.recalcRow(${i})" min="0" step="any">
      <input type="number" class="item-input num item-price" placeholder="0" value="${item.price||0}" oninput="App.recalcRow(${i})" min="0" step="any">
      <div class="item-total" id="item-total-${i}">${formatCurrency((item.qty||0)*(item.price||0))}</div>
      <button class="item-remove" onclick="App.removeItemRow(${i})">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;
  },

  onDescInput(i, inputEl) {
    this.recalcRow(i);
    const q = (inputEl.value || '').trim().toLowerCase();
    const box = document.getElementById('sugg-' + i);
    if (!box) return;
    if (q.length < 1) { box.classList.remove('open'); box.innerHTML = ''; return; }
    const products = (Store.data.products || []).filter(p => !p.archived);
    const matches = products.filter(p =>
      (p.name || '').toLowerCase().includes(q) ||
      (p.description || '').toLowerCase().includes(q) ||
      (p.category || '').toLowerCase().includes(q)
    ).slice(0, 8);
    if (matches.length === 0) { box.classList.remove('open'); box.innerHTML = ''; return; }
    box.innerHTML = matches.map(p => `
      <div class="item-suggestion" onmousedown="App.applyProductSuggestion(${i}, '${escapeHTML(p.id)}')">
        <span class="sugg-name">${escapeHTML(p.name)}</span>
        <span class="sugg-price">${formatCurrency(p.price)}</span>
      </div>
    `).join('');
    box.classList.add('open');
  },

  applyProductSuggestion(i, productId) {
    const p = (Store.data.products || []).find(x => x.id === productId);
    if (!p) return;
    const row = document.querySelector(`[data-item-index="${i}"]`);
    if (!row) return;
    const descInput = row.querySelector('.item-desc');
    const priceInput = row.querySelector('.item-price');
    if (descInput) descInput.value = p.name;
    if (priceInput) priceInput.value = p.price;
    this.hideSuggestions(i);
    this.recalcRow(i);
    toast('Catalogue item applied');
  },

  hideSuggestions(i) {
    const box = document.getElementById('sugg-' + i);
    if (box) { box.classList.remove('open'); box.innerHTML = ''; }
  },

  onCustomerChange() {
    const sel = document.getElementById('customer-select');
    const fields = document.getElementById('new-customer-fields');
    if (sel.value === 'new') fields.style.display = 'block';
    else fields.style.display = 'none';
  },

  addItemRow() {
    const list = document.getElementById('items-list');
    const i = list.children.length;
    list.insertAdjacentHTML('beforeend', this.itemRow({ description: '', qty: 1, price: 0, total: 0 }, i));
  },

  removeItemRow(i) {
    const list = document.getElementById('items-list');
    if (list.children.length <= 1) { toast('At least one item is required'); return; }
    list.children[i].remove();
    [...list.children].forEach((row, idx) => {
      row.setAttribute('data-item-index', idx);
      const desc = row.querySelector('.item-desc');
      if (desc) {
        desc.setAttribute('oninput', `App.onDescInput(${idx}, this)`);
        desc.setAttribute('onfocus', `App.onDescInput(${idx}, this)`);
        desc.setAttribute('onblur', `setTimeout(()=>App.hideSuggestions(${idx}),180)`);
      }
      row.querySelectorAll('input.num').forEach(inp => inp.setAttribute('oninput', `App.recalcRow(${idx})`));
      const totalEl = row.querySelector('.item-total');
      if (totalEl) totalEl.id = `item-total-${idx}`;
      const sugg = row.querySelector('.item-suggestions');
      if (sugg) sugg.id = `sugg-${idx}`;
      row.querySelector('.item-remove').setAttribute('onclick', `App.removeItemRow(${idx})`);
    });
    this.recalcTotals();
  },

  recalcRow(i) {
    const row = document.querySelector(`[data-item-index="${i}"]`);
    if (!row) return;
    const qtyInput = row.querySelectorAll('input.num')[0];
    const priceInput = row.querySelectorAll('input.num')[1];
    const qty = parseFloat(qtyInput && qtyInput.value) || 0;
    const price = parseFloat(priceInput && priceInput.value) || 0;
    const totalEl = document.getElementById(`item-total-${i}`);
    if (totalEl) totalEl.textContent = formatCurrency(qty * price);
    this.recalcTotals();
  },

  recalcTotals() {
    const rows = document.querySelectorAll('#items-list .items-table-row');
    let subtotal = 0;
    rows.forEach(row => {
      const nums = row.querySelectorAll('input.num');
      const qty = parseFloat(nums[0] && nums[0].value) || 0;
      const price = parseFloat(nums[1] && nums[1].value) || 0;
      subtotal += qty * price;
    });
    const taxRate = parseFloat(document.getElementById('tax-rate').value) || 0;
    const tax = subtotal * taxRate / 100;
    document.getElementById('subtotal-display').textContent = formatCurrency(subtotal);
    document.getElementById('tax-display').textContent = formatCurrency(tax);
    document.getElementById('total-display').textContent = formatCurrency(subtotal + tax);
  },

  saveDocument(type, editId) {
    const isQuote = type === 'quote';
    const customerSelect = document.getElementById('customer-select');
    let customerId = '', customerName = '', customerPhone = '', customerEmail = '', customerAddress = '';

    if (customerSelect.value === 'new') {
      customerName = document.getElementById('new-customer-name').value.trim();
      if (!customerName) { toast('Please enter customer name'); return; }
      customerPhone = document.getElementById('new-customer-phone').value.trim();
      customerEmail = document.getElementById('new-customer-email').value.trim();
      const newCustomer = { id: uid(), name: customerName, phone: customerPhone, email: customerEmail, address: '', createdAt: Date.now() };
      Store.data.customers.push(newCustomer);
      customerId = newCustomer.id;
    } else if (customerSelect.value) {
      customerId = customerSelect.value;
      const c = Store.data.customers.find(c => c.id === customerId);
      if (c) { customerName = c.name; customerPhone = c.phone || ''; customerEmail = c.email || ''; customerAddress = c.address || ''; }
    } else {
      customerName = 'Walk-in customer';
    }

    const projectType = document.getElementById('project-type').value;
    const vehicleMake = document.getElementById('veh-make').value.trim();
    const vehicleModel = document.getElementById('veh-model').value.trim();
    const vehicleReg = document.getElementById('veh-reg').value.trim().toUpperCase();
    const number = document.getElementById('doc-number').value.trim();
    const date = document.getElementById('doc-date').value;
    const dueDateEl = document.getElementById('doc-due-date');
    const dueDate = dueDateEl ? dueDateEl.value : '';
    const taxRate = parseFloat(document.getElementById('tax-rate').value) || 0;
    const notes = document.getElementById('doc-notes').value.trim();

    const rows = document.querySelectorAll('#items-list .items-table-row');
    const items = [];
    let subtotal = 0;
    rows.forEach(row => {
      const descInput = row.querySelector('.item-desc');
      const nums = row.querySelectorAll('input.num');
      const description = (descInput && descInput.value || '').trim();
      const qty = parseFloat(nums[0] && nums[0].value) || 0;
      const price = parseFloat(nums[1] && nums[1].value) || 0;
      if (description || qty || price) {
        const total = qty * price;
        items.push({ description, qty, price, total });
        subtotal += total;
      }
    });
    if (items.length === 0) { toast('Please add at least one item'); return; }

    const tax = subtotal * taxRate / 100;
    const total = subtotal + tax;

    if (editId) {
      const list = isQuote ? Store.data.quotes : Store.data.invoices;
      const idx = list.findIndex(d => d.id === editId);
      if (idx >= 0) {
        const existing = list[idx];
        list[idx] = { ...existing, number, customerId, customerName, customerPhone, customerEmail, customerAddress, projectType, vehicleMake, vehicleModel, vehicleReg, date, dueDate, items, taxRate, subtotal, tax, total, notes, balance: Math.max(0, total - (Number(existing.amountPaid) || 0)) };
        Store.save();
        toast(isQuote ? 'Quote updated' : 'Invoice updated');
        this.navigate('invoice-detail', { id: editId });
      }
    } else {
      const newDoc = {
        id: uid(), number, type: isQuote ? 'quote' : 'invoice',
        customerId, customerName, customerPhone, customerEmail, customerAddress,
        projectType, vehicleMake, vehicleModel, vehicleReg,
        date, dueDate, items, taxRate, subtotal, tax, total,
        amountPaid: 0, balance: total, status: isQuote ? 'draft' : 'sent',
        notes, payments: [], createdAt: Date.now(),
        ...(isQuote ? {} : { stage: 'new', stageUpdatedAt: Date.now() })
      };
      if (isQuote) {
        Store.data.quotes.push(newDoc);
        Store.data.business.nextQuoteNo = Store.data.business.nextQuoteNo + 1;
      } else {
        Store.data.invoices.push(newDoc);
        Store.data.business.nextInvoiceNo = Store.data.business.nextInvoiceNo + 1;
      }
      Store.save();
      toast(isQuote ? 'Quote created' : 'Invoice created');
      this.navigate('invoice-detail', { id: newDoc.id });
    }
  },

  newDocument(type) {
    this.state.params = { type };
    this.state.view = 'invoice-form';
    history.pushState({ view: this.state.view, params: this.state.params }, '', '#new-' + type);
    this.render();
  },

  // Supports the manifest shortcuts (New Invoice / New Quote) and deep links.
  handleLaunchHash() {
    let hash = '';
    try { hash = decodeURIComponent((location.hash || '').replace(/^#/, '')).toLowerCase(); } catch (_) { hash = ''; }
    if (!hash) return false;
    if (hash === 'new-invoice') { this.newDocument('invoice'); return true; }
    if (hash === 'new-quote') { this.newDocument('quote'); return true; }
    if (hash === 'invoices') { this.navigate('invoices'); return true; }
    if (hash === 'settings') { this.navigate('settings'); return true; }
    if (hash === 'home') { this.navigate('home'); return true; }
    return false;
  },

  // ==================== Customers ====================
  renderCustomers() {
    const search = (this.state.search || '').toLowerCase();
    let customers = Store.data.customers;
    if (search) customers = customers.filter(c => (c.name + ' ' + (c.phone||'') + ' ' + (c.email||'')).toLowerCase().includes(search));
    customers = [...customers].sort((a,b) => a.name.localeCompare(b.name));

    return `<div class="page">
      <div class="page-header">
        <h1 class="page-title">Customers</h1>
        <p class="page-subtitle">${customers.length} customers</p>
      </div>
      <div class="page-body">
        <div class="search-bar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Search customers..." oninput="App.state.search=this.value;App.renderCustomersList()">
        </div>
        <button class="btn btn-primary btn-block mb-16" onclick="App.navigate('customer-form')">+ Add Customer</button>
        <div id="customers-list">
          ${customers.length === 0 ? this.emptyState('No customers yet', 'Add customers to track their invoices', 'Add Customer', 'App.navigate(\'customer-form\')') :
            customers.map(c => this.customerCard(c)).join('')}
        </div>
      </div>
      ${this.bottomNav('customers')}
    </div>`;
  },

  renderCustomersList() {
    const search = (this.state.search || '').toLowerCase();
    let customers = Store.data.customers;
    if (search) customers = customers.filter(c => (c.name + ' ' + (c.phone||'') + ' ' + (c.email||'')).toLowerCase().includes(search));
    customers = [...customers].sort((a,b) => a.name.localeCompare(b.name));
    const el = document.getElementById('customers-list');
    if (el) el.innerHTML = customers.length === 0 ? this.emptyState('No customers yet', 'Add customers to track their invoices', 'Add Customer', 'App.navigate(\'customer-form\')') : customers.map(c => this.customerCard(c)).join('');
  },

  customerCard(c) {
    const invoices = Store.data.invoices.filter(i => i.customerId === c.id && calculateStatus(i) !== 'cancelled');
    const balance = invoices.reduce((s,i) => s + Math.max(0, (Number(i.total)||0) - (Number(i.amountPaid)||0)), 0);
    return `<div class="card" onclick="App.navigate('customer-detail', {id: '${c.id}'})">
      <div class="list-item">
        <div class="customer-avatar">${escapeHTML((c.name||'?').charAt(0).toUpperCase())}</div>
        <div class="list-item-info">
          <div class="list-item-title">${escapeHTML(c.name)}</div>
          <div class="list-item-sub">${c.phone ? escapeHTML(c.phone) : 'No phone'} · ${invoices.length} invoice${invoices.length!==1?'s':''}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:700; font-size:13px">${formatCurrency(balance)}</div>
          <div style="font-size:11px; color:var(--text-tertiary)">owed</div>
        </div>
      </div>
    </div>`;
  },

  renderCustomerDetail() {
    const id = this.state.params.id;
    const c = Store.data.customers.find(c => c.id === id);
    if (!c) return `<div class="page"><div class="page-body">${this.emptyState('Not found','Customer not found','Go Back','App.navigate(\'customers\')')}</div></div>`;
    const invoices = Store.data.invoices.filter(i => i.customerId === c.id).sort((a,b) => b.createdAt - a.createdAt);
    const quotes = Store.data.quotes.filter(q => q.customerId === c.id).sort((a,b) => b.createdAt - a.createdAt);
    const activeInvoices = invoices.filter(i => calculateStatus(i) !== 'cancelled');
    const totalSpent = activeInvoices.reduce((s,i) => s + (Number(i.total)||0), 0);
    const balance = activeInvoices.reduce((s,i) => s + Math.max(0, (Number(i.total)||0) - (Number(i.amountPaid)||0)), 0);
    const collected = activeInvoices.reduce((s,i) => s + (Number(i.amountPaid)||0), 0);

    return `<div class="page">
      <div class="page-header">
        <div class="topbar">
          <button class="back-btn" onclick="App.navigate('customers')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            Back
          </button>
          <div style="display:flex; gap:8px">
            <button class="icon-btn" onclick="App.confirmDeleteCustomer('${c.id}')" aria-label="Delete customer" title="Delete customer">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
            <button class="icon-btn" onclick="App.navigate('customer-form', {id: '${c.id}'})" aria-label="Edit customer" title="Edit customer">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="page-body">
        <div class="detail-header" style="text-align:center; padding:24px 16px">
          <div class="customer-avatar" style="width:64px; height:64px; font-size:24px; margin:0 auto 12px">${escapeHTML((c.name||'?').charAt(0).toUpperCase())}</div>
          <div style="font-size:20px; font-weight:700">${escapeHTML(c.name)}</div>
          ${c.phone ? `<div style="font-size:13px; color:var(--text-secondary); margin-top:4px">${escapeHTML(c.phone)}</div>` : ''}
          ${c.email ? `<div style="font-size:12px; color:var(--text-tertiary); margin-top:2px">${escapeHTML(c.email)}</div>` : ''}
          ${c.address ? `<div style="font-size:12px; color:var(--text-tertiary); margin-top:2px">${escapeHTML(c.address)}</div>` : ''}
        </div>

        <div class="detail-summary-row">
          <div class="detail-summary">
            <div class="detail-summary-value">${formatCurrency(totalSpent)}</div>
            <div class="detail-summary-label">Total Billed</div>
          </div>
          <div class="detail-summary">
            <div class="detail-summary-value success">${formatCurrency(collected)}</div>
            <div class="detail-summary-label">Collected</div>
          </div>
        </div>
        <div class="detail-summary" style="margin-top:0; margin-bottom:16px">
          <div class="detail-summary-value warning">${formatCurrency(balance)}</div>
          <div class="detail-summary-label">Outstanding Balance</div>
        </div>

        <div class="detail-actions">
          <button class="btn btn-primary btn-sm" onclick="App.newDocumentForCustomer('${c.id}', 'invoice')">New Invoice</button>
          <button class="btn btn-secondary btn-sm" onclick="App.newDocumentForCustomer('${c.id}', 'quote')">New Quote</button>
        </div>

        <div class="section">
          <div class="section-head"><div class="section-title">Invoices (${invoices.length})</div></div>
          ${invoices.length === 0 ? `<p style="color:var(--text-secondary); font-size:13px; padding:14px 0">No invoices yet</p>` : invoices.map(inv => this.invoiceCard(inv)).join('')}
        </div>

        ${quotes.length > 0 ? `<div class="section">
          <div class="section-head"><div class="section-title">Quotes (${quotes.length})</div></div>
          ${quotes.map(q => this.invoiceCard(q)).join('')}
        </div>` : ''}
      </div>
      ${this.bottomNav('customers')}

    const email = document.getElementById('cust-email').value.trim();
    const address = document.getElementById('cust-address').value.trim();

    if (id) {
      const c = Store.data.customers.find(c => c.id === id);
      if (c) {

        Store.data.invoices.forEach(inv => {
          if (inv.customerId === id) { inv.customerName = name; inv.customerPhone = phone; inv.customerEmail = email; inv.customerAddress = address; }
        });
        Store.data.quotes.forEach(q => {
          if (q.customerId === id) { q.customerName = name; q.customerPhone = phone; q.customerEmail = email; q.customerAddress = address; }

        this.navigate('customer-detail', { id });

  savePayment(docId) {
    const doc = Store.data.invoices.find(i => i.id === docId);
    if (!doc) return;
    if (calculateStatus(doc) === 'cancelled') { toast('This invoice is cancelled'); return; }
    const amount = Math.round((parseFloat(document.getElementById('pay-amount').value) || 0) * 100) / 100;
    if (amount <= 0) { toast('Enter a valid amount'); return; }
    const balanceDue = Math.max(0, (Number(doc.total) || 0) - (Number(doc.amountPaid) || 0));
    if (balanceDue <= 0) { toast('This invoice is already fully paid'); return; }
    if (amount > balanceDue + 0.005) {
      toast(`Amount is more than the balance due (${formatCurrency(balanceDue)})`);
      return;
    }
    const date = document.getElementById('pay-date').value;
    const method = document.getElementById('pay-method').value;
    const note = document.getElementById('pay-note').value.trim();

    if (!doc.payments) doc.payments = [];
    doc.payments.push({ amount, date, method, note });
    doc.amountPaid = (Number(doc.amountPaid) || 0) + amount;
    doc.balance = Math.max(0, doc.total - doc.amountPaid);
    doc.status = calculateStatus(doc);
    Store.save();
    closeModal();
    toast('Payment recorded');
    this.navigate('invoice-detail', { id: docId });
  },

  deletePayment(docId, idx) {
    const doc = Store.data.invoices.find(i => i.id === docId);
    if (!doc || !doc.payments || !doc.payments[idx]) return;
    const payment = doc.payments[idx];
    confirmDialog('Delete Payment', `Remove the ${formatCurrency(payment.amount)} payment? This cannot be undone.`, async () => {
      doc.amountPaid = Math.max(0, (Number(doc.amountPaid) || 0) - payment.amount);
      doc.balance = Math.max(0, doc.total - doc.amountPaid);
      doc.status = calculateStatus(doc);
      doc.payments.splice(idx, 1);
      await Store.persist();
      toast('Payment removed');
      this.render();
    });
  },

  confirmDeleteDoc(id) {
    const doc = [...Store.data.invoices, ...Store.data.quotes].find(d => d.id === id);
    if (!doc) { toast('Document not found'); return; }
    const isQuote = doc.type === 'quote';
    const label = doc.number || (isQuote ? 'This quotation' : 'This invoice');
    const customer = doc.customerName || 'Walk-in customer';
    confirmDialog(
      isQuote ? 'Delete Quote' : 'Delete Invoice',
      `${label} for ${customer} will be permanently deleted. This cannot be undone.`,
      async () => {
        Store.data.invoices = Store.data.invoices.filter(d => d.id !== id);
        Store.data.quotes = Store.data.quotes.filter(d => d.id !== id);
        // Keep cross-references consistent after a deletion.
        Store.data.quotes.forEach(q => {
          if (q.convertedToInvoiceId === id) {
            delete q.convertedToInvoiceId;
            if (q.status === 'accepted') q.status = 'sent';
          }
        });
        const quoteIds = new Set(Store.data.quotes.map(q => q.id));
        Store.data.invoices.forEach(inv => {
          if (inv.fromQuoteId && !quoteIds.has(inv.fromQuoteId)) delete inv.fromQuoteId;
        });
        await Store.persist();
        toast(isQuote ? 'Quote deleted' : 'Invoice deleted');
        this.state.invoiceTab = isQuote ? 'quotes' : 'invoices';
        this.state.filter = 'all';
